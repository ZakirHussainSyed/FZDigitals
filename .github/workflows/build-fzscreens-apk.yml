name: Build FZ Screens APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-fzscreens/**'
      - 'slideshow/**'
      - '.github/workflows/build-fzscreens-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK platform and build tools
        run: sdkmanager --install 'platform-tools' 'build-tools;34.0.0' 'platforms;android-34'

      - name: Install Capacitor dependencies
        working-directory: mobile-fzscreens
        run: npm install

      - name: Add Android platform
        working-directory: mobile-fzscreens
        run: |
          npx cap add android
          sed -i 's/minSdkVersion = [0-9]*/minSdkVersion = 24/' android/variables.gradle

      - name: Copy custom map-cache WebView client
        working-directory: mobile-fzscreens
        run: |
          mkdir -p android/app/src/main/java/com/fzscreens/app
          cp -f android-plugin-src/com/fzscreens/app/MainActivity.java android/app/src/main/java/com/fzscreens/app/MainActivity.java
          cp -f android-plugin-src/com/fzscreens/app/SiteWebViewClient.java android/app/src/main/java/com/fzscreens/app/SiteWebViewClient.java
          ls -R android/app/src/main/java/com/fzscreens/app

      - name: Auto-bump app version
        working-directory: mobile-fzscreens
        run: |
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" $GRADLE
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $GRADLE
          grep -E "versionCode|versionName" $GRADLE

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Apply FZ Screens app icon
        working-directory: mobile-fzscreens
        run: |
          LOGO=../slideshow/static/slideshow/logo.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}; size=${d##*:}
            convert "$LOGO" -resize ${size}x${size} -background black -gravity center -extent ${size}x${size} android/app/src/main/res/mipmap-$dir/ic_launcher.png
            cp android/app/src/main/res/mipmap-$dir/ic_launcher.png android/app/src/main/res/mipmap-$dir/ic_launcher_round.png
          done

      - name: Sync Capacitor
        working-directory: mobile-fzscreens
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile-fzscreens/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fzscreens-debug-apk
          path: mobile-fzscreens/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build release AAB
        working-directory: mobile-fzscreens/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Sign AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          jarsigner -keystore /tmp/release.keystore -storetype pkcs12 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" mobile-fzscreens/android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: fzscreens-release-aab
          path: mobile-fzscreens/android/app/build/outputs/bundle/release/app-release.aab

      - name: Build release APK
        working-directory: mobile-fzscreens/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          BT=$ANDROID_HOME/build-tools/34.0.0
          $BT/zipalign -p -f 4 mobile-fzscreens/android/app/build/outputs/apk/release/app-release-unsigned.apk /tmp/fzscreens-aligned.apk
          $BT/apksigner sign --ks /tmp/release.keystore --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" --out mobile-fzscreens/android/app/build/outputs/apk/release/app-release-signed.apk /tmp/fzscreens-aligned.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: fzscreens-release-apk
          path: mobile-fzscreens/android/app/build/outputs/apk/release/app-release-signed.apk
