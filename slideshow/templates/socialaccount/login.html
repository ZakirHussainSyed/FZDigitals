<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Google - FZDigitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b1020;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            border-radius: 12px;
            display: block;
        }
        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 40px 32px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #e8eaf0;
        }
        p {
            color: rgba(232,234,240,0.7);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .provider-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .provider-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 24px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #e8eaf0;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .provider-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
        }
        .provider-btn.google {
            background: #fff;
            color: #333;
            border: none;
        }
        .provider-btn.google:hover {
            background: #f5f5f5;
        }
        .provider-icon {
            width: 20px;
            height: 20px;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: rgba(232,234,240,0.5);
            font-size: 12px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider span {
            padding: 0 16px;
        }
        .back-link {
            display: inline-block;
            margin-top: 24px;
            color: rgba(232,234,240,0.7);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover {
            color: #e8eaf0;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/logo.png" alt="FZDigitals" class="logo" />
        <div class="card">
            <h1>Sign In</h1>
            <p>Choose your preferred sign-in method</p>
            
            <div class="provider-list">
                <a href="/accounts/google/login/" class="provider-btn google">
                    <svg class="provider-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign in with Google
                </a>
            </div>
            
            <div class="divider">
                <span>or</span>
            </div>
            
            <a href="/login/" class="provider-btn">
                Sign in with Email
            </a>
            
            <a href="/signup/" class="back-link">Create an account</a>
        </div>
    </div>
</body>
</html>
