{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login - FZDigitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #000000;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 48px;
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            width: 100px;
            height: 100px;
            margin: 0 auto 32px auto;
            border-radius: 16px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        h1 { 
            font-size: 28px; 
            margin-bottom: 12px;
            background: linear-gradient(135deg, #7c5cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle { 
            color: rgba(232,234,240,0.7); 
            font-size: 16px; 
            margin-bottom: 32px; 
            line-height: 1.5;
        }
        .google-btn {
            appearance: none;
            border: none;
            background: linear-gradient(135deg, #4285f4, #34a853, #fbbc05, #ea4335);
            background-size: 300% 300%;
            color: #fff;
            padding: 16px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            animation: gradient 3s ease infinite;
            box-shadow: 0 4px 15px rgba(124, 92, 255, 0.3);
        }
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(124, 92, 255, 0.5);
        }
        .google-btn:active {
            transform: translateY(0);
        }
        .google-btn svg {
            width: 24px;
            height: 24px;
        }
        .back-link {
            margin-top: 24px;
            display: inline-block;
            color: rgba(232,234,240,0.6);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #7c5cff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="/static/logo.png" alt="FZDigitals" class="logo" />
        <h1>Connect with Google</h1>
        <p class="subtitle">Sign in to manage your slideshows using your Google account</p>
        
        <form method="post" action="{% url 'socialaccount_login' 'google' %}">
            {% csrf_token %}
            <button type="submit" class="google-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#fff"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#fff"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#fff"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#fff"/>
                </svg>
                Continue with Google
            </button>
        </form>
        
        <div style="margin-top: 32px;">
            <a href="/login/" class="back-link">← Back to login</a>
        </div>
    </div>
</body>
</html>
