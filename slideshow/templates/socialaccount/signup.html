{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completing Sign Up - FZDigitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b1020;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            border-radius: 12px;
            display: block;
        }
        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 40px 32px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #e8eaf0;
        }
        p {
            color: rgba(232,234,240,0.7);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #7c5cff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: rgba(232,234,240,0.8);
        }
        .form-input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #e8eaf0;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #7c5cff;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #7c5cff;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .submit-btn:hover { background: #6a4ce6; }
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/logo.png" alt="FZDigitals" class="logo" />
        <div class="card">
            <h1>Complete Your Sign Up</h1>
            <p>Choose a username to complete your account</p>
            
            {% if form.errors %}
            <div class="error-message">
                {% for field, errors in form.errors.items %}
                {{ errors.0 }}
                {% endfor %}
            </div>
            {% endif %}
            
            <form method="post" action="{% url 'socialaccount_signup' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-input" placeholder="Choose a username" required>
                </div>
                <button type="submit" class="submit-btn">Complete Sign Up</button>
            </form>
        </div>
    </div>
</body>
</html>
