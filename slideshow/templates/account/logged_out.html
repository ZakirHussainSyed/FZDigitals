<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signed Out - FZDigitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b1020;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 32px;
            border-radius: 12px;
            display: block;
        }
        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 40px 32px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #e8eaf0;
        }
        p {
            color: rgba(232,234,240,0.7);
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: #4caf50;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            width: 100%;
            background: #7c5cff;
            color: #fff;
        }
        .btn:hover {
            background: #6a4ce6;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/logo.png" alt="FZDigitals" class="logo" />
        <div class="card">
            <div class="success-icon">✓</div>
            <h1>You've been signed out</h1>
            <p>You have successfully signed out of your account. Thanks for using FZDigitals!</p>
            <a href="/" class="btn">Sign In Again</a>
        </div>
    </div>
</body>
</html>
