<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FZDigitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b1020;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            border-radius: 12px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { 
            color: rgba(232,234,240,0.7); 
            font-size: 14px; 
            margin-bottom: 24px; 
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: rgba(232,234,240,0.8);
        }
        .form-input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #e8eaf0;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #7c5cff;
        }
        .form-input::placeholder {
            color: rgba(232,234,240,0.4);
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(232,234,240,0.6);
            cursor: pointer;
            font-size: 12px;
            padding: 0;
        }
        .toggle-password:hover {
            color: rgba(232,234,240,0.9);
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #7c5cff;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-btn:hover { background: #6a4ce6; }
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }
        .error-message.show { display: block; }
        .success-message {
            color: #4caf50;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }
        .success-message.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="/static/logo.png" alt="FZDigitals" class="logo" />
        <h1>FZDigitals</h1>
        <p class="subtitle">Sign in to manage your slideshows</p>
        
        <form method="post" action="{% url 'django_login' %}">
            {% csrf_token %}
            <div class="success-message {% if success %}show{% endif %}">
                {% if success %}
                    {{ success }}
                {% endif %}
            </div>
            <div class="error-message {% if form.errors %}show{% endif %}">
                {% if form.errors %}
                    {% for field, errors in form.errors.items %}
                        {{ errors.0 }}
                    {% endfor %}
                {% endif %}
            </div>
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <div class="password-container">
                    <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('id_password', this)">Show</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>
        
        <div style="margin-top: 20px; text-align: center;">
            <a href="/signup/" style="color: rgba(232,234,240,0.7); text-decoration: none; font-size: 14px;">Create an account</a>
            <span style="color: rgba(232,234,240,0.4); margin: 0 8px;">•</span>
            <a href="/forget-password/" style="color: rgba(232,234,240,0.7); text-decoration: none; font-size: 14px;">Forgot password?</a>
        </div>
    </div>
    
    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = 'Hide';
            } else {
                input.type = 'password';
                button.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
