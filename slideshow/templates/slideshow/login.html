<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ brand.login_title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b1020;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(10px);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo {
            width: 88px;
            height: 88px;
            margin-bottom: 24px;
            border-radius: 24px;
            object-fit: cover;
        }
        .logo.with-wordmark { margin-bottom: 10px; }
        .wordmark {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 18px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { 
            color: rgba(232,234,240,0.7); 
            font-size: 14px; 
            margin-bottom: 24px; 
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: rgba(232,234,240,0.8);
        }
        .form-input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #e8eaf0;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #7c5cff;
        }
        .form-input::placeholder {
            color: rgba(232,234,240,0.4);
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(232,234,240,0.6);
            cursor: pointer;
            font-size: 12px;
            padding: 0;
        }
        .toggle-password:hover {
            color: rgba(232,234,240,0.9);
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #7c5cff;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .submit-btn:hover { background: #6a4ce6; }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }
        .ghost-btn {
            flex: 1;
            display: block;
            padding: 11px;
            border: 1px solid rgba(232,234,240,0.2);
            border-radius: 8px;
            color: rgba(232,234,240,0.85);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
        }
        .ghost-btn:hover { border-color: rgba(232,234,240,0.45); }
        .whatsapp-btn { border-color: rgba(37,211,102,0.5); color: #25d366; }
        .whatsapp-btn:hover { border-color: #25d366; }
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }
        .error-message.show { display: block; }
        .success-message {
            color: #4caf50;
            font-size: 12px;
            margin-bottom: 12px;
            display: none;
        }
        .success-message.show { display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="{{ brand.logo }}" alt="{{ brand.name }}" class="logo{% if brand.wordmark %} with-wordmark{% endif %}" />
        {% if brand.wordmark %}<div class="wordmark">{{ brand.wordmark }}</div>{% endif %}
        <p class="subtitle">{{ brand.login_subtitle }}</p>
        
        <form method="post" action="{% url 'django_login' %}">
            {% csrf_token %}
            <div class="success-message {% if success %}show{% endif %}">
                {% if success %}
                    {{ success }}
                {% endif %}
            </div>
            <div class="error-message {% if form.errors %}show{% endif %}">
                {% if form.errors %}
                    {% for field, errors in form.errors.items %}
                        {{ errors.0 }}
                    {% endfor %}
                {% endif %}
            </div>
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-input" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <div class="password-container">
                    <input type="password" name="password" id="id_password" class="form-input" placeholder="Enter password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('id_password', this)">Show</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">Sign In</button>
        </form>
        
        <div class="btn-row">
            <a href="/" class="ghost-btn">Back</a>
            <a href="https://wa.me/917075985403?text=Hi%20I%20need%20help%20with%20sign%20in" target="_blank" class="ghost-btn whatsapp-btn">Sign in Help</a>
        </div>
    </div>
    
    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = 'Hide';
            } else {
                input.type = 'password';
                button.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
