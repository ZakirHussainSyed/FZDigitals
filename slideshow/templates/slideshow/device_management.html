<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Management - FZDigitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #000000;
            color: #e8eaf0;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        h1 { font-size: 32px; }
        .back-link {
            color: #7c5cff;
            text-decoration: none;
            font-size: 16px;
        }
        .back-link:hover { text-decoration: underline; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 12px;
            padding: 24px;
        }
        .stat-number {
            font-size: 36px;
            font-weight: 800;
            color: #7c5cff;
            margin-bottom: 8px;
        }
        .stat-label {
            color: rgba(232,234,240,0.7);
            font-size: 14px;
        }
        
        .devices-section {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 32px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 24px;
            font-weight: 700;
        }
        .refresh-btn {
            background: rgba(124,92,255,0.2);
            border: 1px solid rgba(124,92,255,0.4);
            color: #7c5cff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        .refresh-btn:hover {
            background: rgba(124,92,255,0.3);
        }
        
        .devices-table {
            width: 100%;
            border-collapse: collapse;
        }
        .devices-table th {
            text-align: left;
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.10);
            color: rgba(232,234,240,0.7);
            font-size: 14px;
            font-weight: 600;
        }
        .devices-table td {
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .devices-table tr:hover {
            background: rgba(255,255,255,0.03);
        }
        .device-id {
            font-family: monospace;
            color: #7c5cff;
        }
        .device-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .device-type.browser {
            background: rgba(124,92,255,0.2);
            color: #7c5cff;
        }
        .device-type.usb {
            background: rgba(76,175,80,0.2);
            color: #4caf50;
        }
        .device-type.tablet {
            background: rgba(255,152,0,0.2);
            color: #ff9800;
        }
        .device-type.unknown {
            background: rgba(158,158,158,0.2);
            color: #9e9e9e;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.assigned {
            background: rgba(76,175,80,0.2);
            color: #4caf50;
        }
        .status-badge.unassigned {
            background: rgba(158,158,158,0.2);
            color: #9e9e9e;
        }
        .action-btn {
            background: #7c5cff;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 8px;
            transition: 0.2s;
        }
        .action-btn:hover {
            background: #6a4ce6;
        }
        .action-btn.unlink {
            background: rgba(244,67,54,0.2);
            border: 1px solid rgba(244,67,54,0.4);
            color: #f44336;
        }
        .action-btn.unlink:hover {
            background: rgba(244,67,54,0.3);
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(232,234,240,0.7);
        }
        .error {
            background: rgba(244,67,54,0.2);
            border: 1px solid rgba(244,67,54,0.4);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            color: #f44336;
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(232,234,240,0.7);
        }
        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: rgba(20,20,30,0.95);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(232,234,240,0.7);
            font-size: 14px;
        }
        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 8px;
            color: #e8eaf0;
            font-size: 14px;
        }
        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #7c5cff;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border: none;
        }
        .modal-btn.primary {
            background: #7c5cff;
            color: #fff;
        }
        .modal-btn.primary:hover {
            background: #6a4ce6;
        }
        .modal-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: #e8eaf0;
        }
        .modal-btn.secondary:hover {
            background: rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Device Management</h1>
            <a href="/user-management/" class="back-link">← Back to User Management</a>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalDevices">0</div>
                <div class="stat-label">Total Devices</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="assignedDevices">0</div>
                <div class="stat-label">Assigned Devices</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="unassignedDevices">0</div>
                <div class="stat-label">Unassigned Devices</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeDevices">0</div>
                <div class="stat-label">Active Devices</div>
            </div>
        </div>
        
        <div class="devices-section">
            <div class="section-header">
                <div class="section-title">All Devices</div>
                <button class="refresh-btn" onclick="loadDevices()">Refresh</button>
            </div>
            
            <div id="error" class="error" style="display: none;"></div>
            <div id="loading" class="loading">Loading devices...</div>
            <div id="emptyState" class="empty-state" style="display: none;">No devices registered yet.</div>
            
            <table class="devices-table" id="devicesTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Device ID</th>
                        <th>Name</th>
                        <th>Type</th>
                        <th>Status</th>
                        <th>Assigned User</th>
                        <th>Screen</th>
                        <th>Last Seen</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="devicesBody"></tbody>
            </table>
        </div>
    </div>
    
    <div class="modal" id="assignModal">
        <div class="modal-content">
            <div class="modal-title">Assign Device</div>
            <input type="hidden" id="assignDeviceId">
            <div class="form-group">
                <label>Device ID</label>
                <input type="text" id="assignDeviceIdDisplay" readonly>
            </div>
            <div class="form-group">
                <label>User</label>
                <select id="assignUser">
                    <option value="">Select User</option>
                </select>
            </div>
            <div class="form-group">
                <label>Screen</label>
                <select id="assignScreen">
                    <option value="1">Slideshow-1</option>
                    <option value="2">Slideshow-2</option>
                    <option value="3">Slideshow-3</option>
                    <option value="4">Slideshow-4</option>
                    <option value="5">Slideshow-5</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
                <button class="modal-btn primary" onclick="confirmAssign()">Assign</button>
            </div>
        </div>
    </div>
    
    <script>
        let allDevices = [];
        let allUsers = [];
        
        async function loadDevices() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const emptyState = document.getElementById('emptyState');
            const table = document.getElementById('devicesTable');
            
            loading.style.display = 'block';
            error.style.display = 'none';
            table.style.display = 'none';
            emptyState.style.display = 'none';
            
            try {
                const response = await fetch('/api/devices/');
                const data = await response.json();
                
                loading.style.display = 'none';
                
                if (!data.success) {
                    error.textContent = data.error || 'Failed to load devices';
                    error.style.display = 'block';
                    return;
                }
                
                allDevices = data.devices;
                renderDevices();
                updateStats();
            } catch (err) {
                loading.style.display = 'none';
                error.textContent = 'Failed to load devices: ' + err.message;
                error.style.display = 'block';
            }
        }
        
        async function loadUsers() {
            try {
                const response = await fetch('/api/users/');
                const data = await response.json();
                
                if (data.success) {
                    allUsers = data.users;
                    populateUserSelect();
                }
            } catch (err) {
                console.error('Failed to load users:', err);
            }
        }
        
        function populateUserSelect() {
            const select = document.getElementById('assignUser');
            select.innerHTML = '<option value="">Select User</option>';
            
            allUsers.forEach(user => {
                const option = document.createElement('option');
                option.value = user.id;
                option.textContent = `${user.email} (ID: ${user.id})`;
                select.appendChild(option);
            });
        }
        
        function renderDevices() {
            const tbody = document.getElementById('devicesBody');
            const emptyState = document.getElementById('emptyState');
            const table = document.getElementById('devicesTable');
            
            tbody.innerHTML = '';
            
            if (allDevices.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            table.style.display = 'table';
            
            allDevices.forEach(device => {
                const row = document.createElement('tr');
                
                const statusClass = device.user_id ? 'assigned' : 'unassigned';
                const statusText = device.user_id ? 'Assigned' : 'Unassigned';
                
                const deviceTypeClass = ['browser', 'usb', 'tablet'].includes(device.device_type) ? device.device_type : 'unknown';
                
                const lastSeen = device.last_seen ? new Date(device.last_seen).toLocaleString() : 'Never';
                
                row.innerHTML = `
                    <td><span class="device-id">${device.device_id}</span></td>
                    <td>${device.name || 'Unnamed'}</td>
                    <td><span class="device-type ${deviceTypeClass}">${device.device_type || 'Unknown'}</span></td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td>${device.user_email || '-'}</td>
                    <td>${device.screen ? `Slideshow-${device.screen}` : '-'}</td>
                    <td>${lastSeen}</td>
                    <td>
                        ${device.user_id ? 
                            `<button class="action-btn unlink" onclick="unlinkDevice('${device.device_id}')">Unlink</button>` :
                            `<button class="action-btn" onclick="openAssignModal('${device.device_id}')">Link</button>`
                        }
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        function updateStats() {
            const total = allDevices.length;
            const assigned = allDevices.filter(d => d.user_id).length;
            const unassigned = total - assigned;
            const active = allDevices.filter(d => d.is_active).length;
            
            document.getElementById('totalDevices').textContent = total;
            document.getElementById('assignedDevices').textContent = assigned;
            document.getElementById('unassignedDevices').textContent = unassigned;
            document.getElementById('activeDevices').textContent = active;
        }
        
        function openAssignModal(deviceId) {
            const device = allDevices.find(d => d.device_id === deviceId);
            if (!device) return;
            
            document.getElementById('assignDeviceId').value = deviceId;
            document.getElementById('assignDeviceIdDisplay').value = deviceId;
            document.getElementById('assignUser').value = '';
            document.getElementById('assignScreen').value = '1';
            
            document.getElementById('assignModal').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('assignModal').classList.remove('show');
        }
        
        async function confirmAssign() {
            const deviceId = document.getElementById('assignDeviceId').value;
            const userId = document.getElementById('assignUser').value;
            const screen = document.getElementById('assignScreen').value;
            
            if (!userId) {
                alert('Please select a user');
                return;
            }
            
            try {
                const response = await fetch(`/api/device/${deviceId}/assign/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: parseInt(userId),
                        screen: parseInt(screen)
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    closeModal();
                    loadDevices();
                } else {
                    alert('Failed to assign device: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Failed to assign device: ' + err.message);
            }
        }
        
        async function unlinkDevice(deviceId) {
            if (!confirm('Are you sure you want to unlink this device?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/device/${deviceId}/assign/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: null,
                        screen: 1
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    loadDevices();
                } else {
                    alert('Failed to unlink device: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Failed to unlink device: ' + err.message);
            }
        }
        
        // Load data on page load
        loadDevices();
        loadUsers();
    </script>
</body>
</html>
