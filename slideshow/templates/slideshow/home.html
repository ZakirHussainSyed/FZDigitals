<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FZ Digitals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:ital,wght@1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.55);
            z-index: -1;
        }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #000000;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: transparent;
        }
        .logo {
            max-width: 180px;
            display: block;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .btn {
            appearance: none;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: #e8eaf0;
            background: rgba(255,255,255,0.1);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.15); }
        .btn.primary {
            background: #7c5cff;
            color: #fff;
        }
        .btn.primary:hover { background: #6a4ce6; }
        .hero {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            padding: 30px 24px 40px;
        }
        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .hero p {
            font-family: 'Dancing Script', cursive;
            font-size: 54px;
            font-style: italic;
            font-weight: 400;
            color: #e8eaf0;
            line-height: 1.3;
            max-width: 900px;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <video class="video-bg" autoplay muted loop playsinline poster="/static/logo.png">
        <source src="/static/landing-bg.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <header class="header">
        <img src="/static/logo.png" alt="FZ Digitals" class="logo" />
        <nav class="nav">
            <a href="{% url 'django_login' %}" class="btn">Log In</a>
            <a href="https://wa.me/919989985403?text=Hello%2C%20I%20am%20interested%20in%20FZ%20Digitals" target="_blank" class="btn primary">Get Started</a>
        </nav>
    </header>

    <main class="hero">
        <p>Run and manage ads on multi screens remotely from anywhere.</p>
    </main>
</body>
</html>
