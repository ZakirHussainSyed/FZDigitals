<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FZ Digitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #000000;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: #000000;
        }
        .logo {
            max-width: 180px;
            display: block;
        }
        .nav {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .btn {
            appearance: none;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            color: #e8eaf0;
            background: rgba(255,255,255,0.1);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover { background: rgba(255,255,255,0.15); }
        .btn.primary {
            background: #7c5cff;
            color: #fff;
        }
        .btn.primary:hover { background: #6a4ce6; }
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 24px;
        }
        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .hero p {
            font-size: 18px;
            color: rgba(232,234,240,0.7);
            max-width: 500px;
            margin-bottom: 32px;
        }
    </style>
</head>
<body>
    <header class="header">
        <img src="/static/logo.png" alt="FZ Digitals" class="logo" />
        <nav class="nav">
            <a href="{% url 'django_login' %}" class="btn">Log In</a>
            <a href="https://wa.me/919989985403?text=Hello%2C%20I%20am%20interested%20in%20FZ%20Digitals" target="_blank" class="btn primary">Get Started</a>
        </nav>
    </header>

    <main class="hero">
        <p>Digital signage made simple. Upload your media, pair your display on multi screens, and manage everything from one place remotely from anywhere.</p>
    </main>
</body>
</html>
