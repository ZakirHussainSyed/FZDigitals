<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FZDigitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b1020;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .signup-container {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(10px);
            max-width: 450px;
            width: 100%;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 12px;
            display: block;
        }
        h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
        .subtitle { 
            color: rgba(232,234,240,0.7); 
            font-size: 14px; 
            margin-bottom: 24px; 
            text-align: center;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: rgba(232,234,240,0.8);
        }
        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #e8eaf0;
            font-size: 14px;
        }
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: #7c5cff;
        }
        .form-input::placeholder {
            color: rgba(232,234,240,0.4);
        }
        .form-select {
            cursor: pointer;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #7c5cff;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .submit-btn:hover { background: #6a4ce6; }
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(232,234,240,0.7);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #e8eaf0; }
    </style>
</head>
<body>
    <div class="signup-container">
        <img src="/static/logo.png" alt="FZDigitals" class="logo" />
        <h1>Create Account</h1>
        <p class="subtitle">Sign up to manage your slideshows</p>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-input" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="id_email">Email</label>
                <input type="email" name="email" id="id_email" class="form-input" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-input" placeholder="Create a password" required>
            </div>
            <div class="form-group">
                <label for="id_confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="id_confirm_password" class="form-input" placeholder="Confirm your password" required>
            </div>
            <div class="form-group">
                <label for="id_security_question">Security Question</label>
                <select name="security_question" id="id_security_question" class="form-select" required>
                    <option value="">Select a security question</option>
                    {% for value, text in security_questions %}
                    <option value="{{ value }}">{{ text }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="id_security_answer">Security Answer</label>
                <input type="text" name="security_answer" id="id_security_answer" class="form-input" placeholder="Your answer" required>
            </div>
            <button type="submit" class="submit-btn">Create Account</button>
        </form>
        
        <a href="/" class="back-link">← Back to Login</a>
    </div>
</body>
</html>
