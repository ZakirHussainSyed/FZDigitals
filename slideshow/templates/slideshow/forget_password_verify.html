<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Security Answer - FZDigitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b1020;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 32px;
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 100%;
        }
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 12px;
            display: block;
        }
        h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
        .subtitle { 
            color: rgba(232,234,240,0.7); 
            font-size: 14px; 
            margin-bottom: 24px; 
            text-align: center;
        }
        .security-question {
            background: rgba(124,92,255,0.1);
            border: 1px solid rgba(124,92,255,0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #e8eaf0;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: rgba(232,234,240,0.8);
        }
        .form-input {
            width: 100%;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #e8eaf0;
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: #7c5cff;
        }
        .form-input::placeholder {
            color: rgba(232,234,240,0.4);
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(232,234,240,0.6);
            cursor: pointer;
            font-size: 12px;
            padding: 0;
        }
        .toggle-password:hover {
            color: rgba(232,234,240,0.9);
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #7c5cff;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .submit-btn:hover { background: #6a4ce6; }
        .error-message {
            color: #ff4444;
            font-size: 12px;
            margin-bottom: 16px;
            text-align: center;
        }
        .back-link {
            text-align: center;
            margin-top: 20px;
            color: rgba(232,234,240,0.7);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #e8eaf0; }
    </style>
</head>
<body>
    <div class="container">
        <img src="/static/logo.png" alt="FZDigitals" class="logo" />
        <h1>Security Verification</h1>
        <p class="subtitle">Answer your security question to reset password</p>
        
        <div class="security-question">
            <strong>Question:</strong> {{ security_question_text }}
        </div>
        
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="username" value="{{ username }}">
            <div class="form-group">
                <label for="id_security_answer">Your Answer</label>
                <input type="text" name="security_answer" id="id_security_answer" class="form-input" placeholder="Enter your answer" required>
            </div>
            <div class="form-group">
                <label for="id_new_password">New Password</label>
                <div class="password-container">
                    <input type="password" name="new_password" id="id_new_password" class="form-input" placeholder="Enter new password" required>
                    <button type="button" class="toggle-password" onclick="togglePassword('id_new_password', this)">Show</button>
                </div>
            </div>
            <button type="submit" class="submit-btn">Reset Password</button>
        </form>
        
        <a href="/" class="back-link">← Back to Login</a>
    </div>
    
    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                button.textContent = 'Hide';
            } else {
                input.type = 'password';
                button.textContent = 'Show';
            }
        }
    </script>
</body>
</html>
