<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FZDigitals</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FZDigitals" />
    <link rel="apple-touch-icon" href="/static/slideshow/icon.svg" />

    <meta name="mobile-web-app-capable" content="yes" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stage {
            position: fixed;
            inset: 0;
            background: #000;
        }
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 1000ms ease, transform 1000ms ease;
            will-change: opacity, transform;
        }
        .slide.active {
            opacity: 1;
            transform: translateX(0);
        }
        .slide.prev {
            transform: translateX(-100%);
        }
        img, video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent 25%, transparent 75%, rgba(0,0,0,0.55));
            opacity: 0;
            transition: opacity 150ms ease;
        }
        .stage.paused .overlay { opacity: 1; }
        .stage.paused .tap-layer { pointer-events: none; }

        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 150ms ease, transform 150ms ease;
            pointer-events: none;
        }
        .stage.paused .controls {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .btn {
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.14);
            color: #fff;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 800;
            min-width: 110px;
        }
        .fullscreen-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.85);
            border-radius: 999px;
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 150ms ease;
            pointer-events: none;
        }
        .stage.paused .fullscreen-btn {
            opacity: 1;
            pointer-events: auto;
        }
        .fullscreen-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .counter {
            position: absolute;
            top: 16px;
            right: 16px;
            color: rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 10px 12px;
            border-radius: 999px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 150ms ease;
        }
        .stage.paused .counter { opacity: 1; }

        .empty {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.75);
            font-size: 16px;
            text-align: center;
            padding: 24px;
        }
        .empty.show { display: flex; }

        /* Pairing screen */
        .pairing-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 24px;
        }
        .pairing-screen.hidden { display: none; }
        .pairing-title {
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 24px;
        }
        .pairing-input {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 20px;
            color: #fff;
            text-align: center;
            letter-spacing: 4px;
            width: 280px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }
        .pairing-input:focus {
            outline: none;
            border-color: #7c5;
        }
        .pairing-btn {
            background: #7c5cff;
            border: none;
            border-radius: 12px;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            min-width: 200px;
        }
        .pairing-btn:active { opacity: 0.8; }
        .pairing-error {
            color: #ff4444;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        .pairing-error.show { display: block; }

        /* Splash screen */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }
        .splash-screen.hidden { display: none; }
        .splash-screen img {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
        }

        /* Big tap area for pause/resume */
        .tap-layer {
            position: absolute;
            inset: 0;
            z-index: 100;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="splash-screen hidden" id="splashScreen">
        <img src="/static/slideshow/logo.png" alt="FZDigitals" id="splashLogo">
    </div>
    <div class="pairing-screen" id="pairingScreen">
        <div class="pairing-title">Enter Pairing ID</div>
        <input type="text" class="pairing-input" id="pairingInput" placeholder="XXXXXXXX" maxlength="8" autocomplete="off">
        <button class="pairing-btn" id="pairingBtn">Connect</button>
        <a href="https://fzdigitals.onrender.com" target="_blank" style="color:#7c5cff;font-size:13px;margin-top:16px;display:inline-block;text-decoration:none;">Visit <span style="text-decoration:underline;">https://fzdigitals.onrender.com</span> to get Display code</a>
        <div class="pairing-error" id="pairingError">Invalid pairing ID</div>
    </div>
    
    <div class="stage" id="stage">
        <div class="tap-layer" id="tap"></div>
        <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <div class="empty" id="empty">No media uploaded yet.</div>
        <div id="slides"></div>
        <div class="overlay"></div>
        <div class="counter" id="counter">0 / 0</div>
        <div class="controls">
            <button class="btn" id="prev">Back</button>
            <button class="btn" id="next">Next</button>
        </div>
    </div>

    <script>
        let media = [];
        let current = 0;
        let autoplayTimer = null;
        let resumeTimer = null;
        let paused = false;
        let deviceToken = localStorage.getItem('fz_device_token');
        let savedPairingId = localStorage.getItem('fz_pairing_id') || null;
        let pairedScreen = 1;
        let deviceId = null;
        
        function getBrowserId() {
            let id = localStorage.getItem('fz_browser_id');
            if (!id) {
                const bytes = new Uint8Array(4);
                crypto.getRandomValues(bytes);
                id = 'BR-' + Array.from(bytes)
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('')
                    .toUpperCase();
                localStorage.setItem('fz_browser_id', id);
            }
            return id;
        }

        // Hybrid approach: Priority 1 - URL code parameter
        const urlParams = new URLSearchParams(window.location.search);
        const pairingIdFromUrl = urlParams.get('id') || '{{ pairing_id|default:"" }}';
        
        const pairingScreen = document.getElementById('pairingScreen');
        const pairingInput = document.getElementById('pairingInput');
        const pairingBtn = document.getElementById('pairingBtn');
        const pairingError = document.getElementById('pairingError');

        console.log('Pairing elements found:', {
            pairingScreen: !!pairingScreen,
            pairingInput: !!pairingInput,
            pairingBtn: !!pairingBtn,
            pairingError: !!pairingError
        });

        const stage = document.getElementById('stage');
        const slidesEl = document.getElementById('slides');
        const emptyEl = document.getElementById('empty');
        const counterEl = document.getElementById('counter');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const tapLayer = document.getElementById('tap');

        function setPaused(v) {
            paused = v;
            stage.classList.toggle('paused', paused);
            if (paused) {
                stopAutoplay();
                scheduleResume();
            } else {
                clearResume();
                startAutoplay();
            }
        }

        function clearResume() {
            if (resumeTimer) clearTimeout(resumeTimer);
            resumeTimer = null;
        }

        // Once screen is untouch, slideshow should auto start in 5 seconds
        function scheduleResume() {
            clearResume();
            resumeTimer = setTimeout(() => {
                setPaused(false);
            }, 10000);
        }

        function stopAutoplay() {
            if (autoplayTimer) clearInterval(autoplayTimer);
            autoplayTimer = null;
        }

        function startAutoplay() {
            console.log('startAutoplay called, paused:', paused, 'media.length:', media.length, 'autoplayTimer:', autoplayTimer);
            // Don't restart if already running
            if (autoplayTimer) {
                console.log('startAutoplay: already running, skipping');
                return;
            }
            if (!media.length) {
                console.log('startAutoplay: no media, returning');
                return;
            }
            if (paused) {
                console.log('startAutoplay: paused, returning');
                return;
            }
            console.log('startAutoplay: starting interval with 10000ms');
            autoplayTimer = setInterval(() => {
                console.log('Autoplay interval fired, showing next slide');
                show(current + 1);
            }, 10000);
        }

        function updateCounter() {
            counterEl.textContent = `${media.length ? current + 1 : 0} / ${media.length}`;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Auto-enter fullscreen on load for kiosk mode
        function requestAutoFullscreen() {
            // Try to enter fullscreen automatically
            const requestFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log(`Auto-fullscreen blocked (user interaction required): ${err.message}`);
                    });
                }
            };

            // Try immediately (may be blocked by browser)
            requestFullscreen();

            // Also try on first user interaction
            const enableFullscreenOnInteraction = () => {
                requestFullscreen();
                document.removeEventListener('click', enableFullscreenOnInteraction);
                document.removeEventListener('touchstart', enableFullscreenOnInteraction);
            };

            document.addEventListener('click', enableFullscreenOnInteraction, { once: true });
            document.addEventListener('touchstart', enableFullscreenOnInteraction, { once: true });
        }

        function renderSlides() {
            slidesEl.innerHTML = '';
            if (!media.length) {
                emptyEl.classList.add('show');
                updateCounter();
                stopAutoplay();
                return;
            }
            emptyEl.classList.remove('show');

            media.forEach((f, idx) => {
                const wrap = document.createElement('div');
                wrap.className = 'slide' + (idx === current ? ' active' : '');

                if (f.type === 'image') {
                    const img = document.createElement('img');
                    img.src = f.url;
                    img.alt = f.title;
                    wrap.appendChild(img);
                } else {
                    const vid = document.createElement('video');
                    vid.src = f.url;
                    vid.controls = false;
                    vid.muted = true;
                    vid.playsInline = true;
                    wrap.appendChild(vid);
                }

                slidesEl.appendChild(wrap);
            });

            updateCounter();
        }

        function show(i) {
            console.log('show called with index:', i, 'current:', current, 'media.length:', media.length);
            if (!media.length) {
                console.log('show: no media, returning');
                return;
            }
            const prev = current;
            current = (i + media.length) % media.length;
            console.log('show: updated current to:', current);
            const nodes = slidesEl.querySelectorAll('.slide');
            console.log('show: found', nodes.length, 'slide nodes');
            
            nodes.forEach((n, idx) => {
                n.classList.remove('active', 'prev');
                if (idx === current) {
                    n.classList.add('active');
                } else if (idx === prev) {
                    n.classList.add('prev');
                }
            });

            nodes.forEach((n, idx) => {
                const v = n.querySelector('video');
                if (!v) return;
                if (idx !== current) {
                    v.pause();
                } else {
                    // try play silently; if blocked, it's okay
                    v.play().catch(() => {});
                }
            });

            updateCounter();
        }

        async function refresh() {
            console.log('refresh: checking slideshow sources');
            
            // Priority 1: Try explicit URL code pairing
            if (pairingIdFromUrl && !deviceToken) {
                console.log('refresh: trying URL code pairing');
                await connectPairing(pairingIdFromUrl);
                return;
            }
            
            // Priority 2: Use existing device token
            if (deviceToken) {
                console.log('refresh: using existing pairing');
                deviceId = deviceId || getBrowserId();
                const res = await fetch(
                    `/api/device/${encodeURIComponent(deviceId)}/slideshow/?token=${encodeURIComponent(deviceToken)}`
                );
                const data = await res.json();
                if (data.success) {
                    media = data.files;
                    if (current >= media.length) current = 0;
                    renderSlides();
                    show(current);
                    // Ensure autoplay starts
                    setPaused(false);
                    startAutoplay();
                    return;
                }
                if (res.status === 403 || res.status === 404) {
                    // Device was removed or re-paired elsewhere: pair again
                    deviceToken = null;
                    localStorage.removeItem('fz_device_token');
                    if (pairingIdFromUrl) {
                        await connectPairing(pairingIdFromUrl);
                        return;
                    }
                    if (savedPairingId) {
                        console.log('refresh: token invalid, trying saved pairing id');
                        await connectPairing(savedPairingId);
                        return;
                    }
                    pairingScreen.classList.remove('hidden');
                }
                return;
            }
            
            // Priority 3: Try saved pairing code
            if (savedPairingId) {
                console.log('refresh: trying saved pairing id');
                await connectPairing(savedPairingId);
                return;
            }
            
            console.log('refresh: no slideshow source available');
            pairingScreen.classList.remove('hidden');
        }

        async function connectPairing(pairingId = null) {
            const id = pairingId || pairingInput.value.trim().toUpperCase();
            if (!id || id.length !== 8) {
                if (!pairingId) {
                    pairingError.textContent = 'Please enter 8-character ID';
                    pairingError.classList.add('show');
                }
                return;
            }

            try {
                console.log('Attempting to connect with pairing ID:', id);
                deviceId = getBrowserId();
                const res = await fetch(
                    `/api/pairing/${id}/?browser_id=${encodeURIComponent(deviceId)}`
                );
                const data = await res.json();
                console.log('Pairing response:', data);
                
                if (data.success) {
                    deviceToken = data.device_token;
                    localStorage.setItem('fz_device_token', deviceToken);
                    localStorage.setItem('fz_pairing_id', id);
                    savedPairingId = id;
                    pairedScreen = data.screen || 1;
                    pairingScreen.classList.add('hidden');
                    // Update URL to include pairing ID
                    const newUrl = `/tablet/${id}/`;
                    window.history.pushState({path: newUrl}, '', newUrl);
                    refresh();
                } else if (data.user_deleted) {
                    // User that owned this pairing was deleted; clear saved code and show message
                    if (savedPairingId === id) {
                        localStorage.removeItem('fz_pairing_id');
                        savedPairingId = null;
                    }
                    pairingScreen.classList.remove('hidden');
                    window.history.replaceState(null, '', '/tablet/');
                    pairingError.innerHTML = data.error || 'This pairing code is no longer active. Please contact <a href="mailto:growwithfzdigitals@gmail.com" style="color:#7c5cff;text-decoration:underline;">growwithfzdigitals@gmail.com</a> for service and a new pairing code.';
                    pairingError.classList.add('show');
                } else {
                    // Invalid pairing; clear it if it was saved and show error
                    if (savedPairingId === id) {
                        localStorage.removeItem('fz_pairing_id');
                        savedPairingId = null;
                    }
                    pairingError.textContent = data.error || 'Invalid pairing ID';
                    pairingError.classList.add('show');
                    pairingScreen.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Pairing error:', error);
                // Don't clear saved pairing on network errors, let retry later
                if (!pairingId) {
                    pairingError.textContent = 'Connection failed: ' + error.message;
                    pairingError.classList.add('show');
                }
            }
        }

        pairingBtn.addEventListener('click', () => {
            console.log('Connect button clicked');
            connectPairing();
        });
        pairingInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                console.log('Enter key pressed');
                connectPairing();
            }
        });

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            show(current - 1);
            scheduleResume();
        });

        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            show(current + 1);
            scheduleResume();
        });

        // Touch behavior:
        // - on touch -> pause and show controls
        // - when touch ends -> keep paused and resume after 5s
        
        // Pointer events (modern browsers)
        tapLayer.addEventListener('pointerdown', (e) => {
            console.log('pointerdown event fired');
            e.preventDefault();
            setPaused(true);
        });
        tapLayer.addEventListener('pointerup', (e) => {
            console.log('pointerup event fired');
            e.preventDefault();
            // user stopped touching; already paused, resume timer is scheduled
        });
        tapLayer.addEventListener('pointercancel', (e) => {
            console.log('pointercancel event fired');
            e.preventDefault();
            scheduleResume();
        });

        // Touch events (Safari iOS support)
        tapLayer.addEventListener('touchstart', (e) => {
            console.log('touchstart event fired');
            e.preventDefault();
            setPaused(true);
        }, { passive: false });
        tapLayer.addEventListener('touchend', (e) => {
            console.log('touchend event fired');
            e.preventDefault();
            // user stopped touching; already paused, resume timer is scheduled
        }, { passive: false });
        
        // Prevent context menu on long press
        tapLayer.addEventListener('contextmenu', (e) => {
            console.log('contextmenu event fired');
            e.preventDefault();
            return false;
        });

        function showSplash() {
            const splash = document.getElementById('splashScreen');
            const logo = document.getElementById('splashLogo');
            splash.classList.remove('hidden');
            return new Promise((resolve) => {
                let minDone = false;
                let imgDone = false;
                const maybeFinish = () => {
                    if (minDone && imgDone) {
                        splash.classList.add('hidden');
                        resolve();
                    }
                };
                setTimeout(() => { minDone = true; maybeFinish(); }, 3000);
                if (logo.complete) {
                    imgDone = true;
                    maybeFinish();
                } else {
                    logo.onload = () => { imgDone = true; maybeFinish(); };
                    logo.onerror = () => { imgDone = true; maybeFinish(); };
                }
            });
        }

        function startApp() {
            console.log('Initial load: starting app after splash');
            setInterval(refresh, 30000);
            refresh();
            requestAutoFullscreen();
        }

        // Keep list updated
        showSplash().then(startApp);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        }
    </script>
</body>
</html>
