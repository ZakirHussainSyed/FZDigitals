<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>FZDigitals</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FZDigitals" />
    <link rel="apple-touch-icon" href="/static/slideshow/icon.svg" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta http-equiv="Cache-Control" content="no-store, must-revalidate, no-cache" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #000; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }
        .stage {
            position: fixed;
            inset: 0;
            background: #000;
        }
        .slide {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 1000ms ease, transform 1000ms ease;
            will-change: opacity, transform;
        }
        .slide.active {
            opacity: 1;
            transform: translateX(0);
        }
        .slide.prev {
            transform: translateX(-100%);
        }
        img, video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to bottom, rgba(0,0,0,0.45), transparent 25%, transparent 75%, rgba(0,0,0,0.55));
            opacity: 0;
            transition: opacity 150ms ease;
        }
        .stage.paused .overlay { opacity: 1; }
        .stage.paused .tap-layer { pointer-events: none; }

        .controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 16px;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 150ms ease, transform 150ms ease;
            pointer-events: none;
        }
        .stage.paused .controls {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .btn {
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.14);
            color: #fff;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 16px;
            font-weight: 800;
            min-width: 110px;
        }
        .fullscreen-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            color: rgba(255,255,255,0.85);
            border-radius: 999px;
            padding: 10px 12px;
            font-size: 13px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 150ms ease;
            pointer-events: none;
        }
        .stage.paused .fullscreen-btn {
            opacity: 1;
            pointer-events: auto;
        }
        .fullscreen-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .counter {
            position: absolute;
            top: 16px;
            right: 16px;
            color: rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.18);
            padding: 10px 12px;
            border-radius: 999px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 150ms ease;
        }
        .stage.paused .counter { opacity: 1; }

        .empty {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.75);
            font-size: 16px;
            text-align: center;
            padding: 24px;
        }
        .empty.show { display: flex; }

        /* Pairing screen */
        .pairing-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 24px;
        }
        .pairing-screen.hidden { display: none; }
        .pairing-logo {
            margin-bottom: 24px;
        }
        .pairing-logo img {
            width: 176px;
            height: auto;
            display: block;
        }
        .pairing-hint {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            text-align: center;
            margin-top: 16px;
        }

        /* Splash screen */
        .splash-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 300;
        }
        .splash-screen.hidden { display: none; }
        .splash-screen img {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
        }

        /* Big tap area for pause/resume */
        .tap-layer {
            position: absolute;
            inset: 0;
            z-index: 100;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        /* Sync loading screen */
        .sync-screen {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 250;
        }
        .sync-screen.hidden { display: none; }
        .sync-screen img {
            max-width: 70%;
            max-height: 70%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="splash-screen hidden" id="splashScreen">
        <img src="/static/slideshow/logo.png" alt="FZDigitals" id="splashLogo">
    </div>
    <div class="sync-screen hidden" id="syncScreen">
        <img src="/static/slideshow/logo.png" alt="FZ Screen">
    </div>
    <div class="pairing-screen" id="pairingScreen">
        <div class="pairing-logo" id="pairingLogo">
            <img src="/static/slideshow/logo.png" alt="FZ Screen">
        </div>
        <div id="qrWrap" style="margin: 16px 0; display: block;">
            <p id="qrStatus" style="color: rgba(255,255,255,0.8); font-size: 14px; text-align: center; margin-bottom: 8px;">Creating display...</p>
            <img id="qrImg" style="width: 220px; height: 220px; background: #fff; padding: 12px; border-radius: 16px; display: block; margin: 0 auto;" alt="QR code">
            <p class="pairing-hint" id="qrHint">Scan to link this display</p>
        </div>
    </div>
    
    <div class="stage" id="stage">
        <div class="tap-layer" id="tap"></div>
        <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
        <div class="empty" id="empty">No media uploaded yet.</div>
        <div id="slides"></div>
        <div class="overlay"></div>
        <div class="counter" id="counter">0 / 0</div>
        <div class="controls">
            <button class="btn" id="prev">Back</button>
            <button class="btn" id="next">Next</button>
        </div>
    </div>

    <script>
        let media = [];
        let current = 0;
        let autoplayTimer = null;
        let resumeTimer = null;
        let paused = false;
        let transitioning = false;
        let devicePaired = false;  // set once the slideshow API returns success
        let pollTimer = null;
        let deviceToken = localStorage.getItem('fz_device_token') || null;
        let pairedScreen = 1;
        let deviceId = localStorage.getItem('fz_device_id') || null;
        const rawLog = console.log;
        const rawWarn = console.warn;
        const rawError = console.error;

        function dlog(...args) {
            rawLog.apply(console, args);
        }
        function dwarn(...args) {
            rawWarn.apply(console, args);
        }
        function derror(...args) {
            rawError.apply(console, args);
        }

        const MediaDownloader = (typeof Capacitor !== 'undefined' && Capacitor.Plugins && Capacitor.Plugins.MediaDownloader) ? Capacitor.Plugins.MediaDownloader : null;
        dlog('Capacitor:', typeof Capacitor, 'MediaDownloader:', !!MediaDownloader);
        window.addEventListener('localMediaLog', e => dlog('localMediaLog', JSON.stringify(e.detail)));

        function showLoading() {
            const el = document.getElementById('syncScreen');
            if (el) el.classList.remove('hidden');
        }
        function hideLoading() {
            const el = document.getElementById('syncScreen');
            if (el) el.classList.add('hidden');
        }

        function getMediaSrc(f) {
            if (f.localUrl) return f.localUrl;
            return f.url;
        }

        async function syncMediaToLocal(files) {
            if (!MediaDownloader) return files;
            try {
                dlog('MediaDownloader.sync starting for', files.length, 'files');
                const res = await MediaDownloader.sync({ files: files });
                dlog('MediaDownloader.sync result:', res);
                if (res && res.files) {
                    dlog('MediaDownloader.sync raw files:', JSON.stringify(res.files));
                    const map = {};
                    res.files.forEach(item => { if (item.id) map[item.id] = item; });
                    files = files.map(f => {
                        const local = map[f.id];
                        if (local && (local.localUrl || local.localPath)) {
                            return { ...f, localUrl: local.localUrl, localPath: local.localPath, _status: local.status };
                        }
                        return f;
                    });
                }
            } catch (err) {
                dwarn('MediaDownloader.sync error:', err);
            }
            return files;
        }

        async function cacheMediaUrls(urls) {
            if (typeof Capacitor !== 'undefined' && Capacitor.isNativePlatform()) return;
            if (!('serviceWorker' in navigator)) return;
            try {
                const reg = await navigator.serviceWorker.ready;
                if (reg.active) {
                    reg.active.postMessage({type: 'CACHE_MEDIA', urls: urls});
                }
            } catch (err) {
                derror('cacheMediaUrls error:', err);
            }
        }

        function loadCachedMedia() {
            const saved = localStorage.getItem('fz_media');
            if (!saved) return null;
            try {
                return JSON.parse(saved);
            } catch (e) {
                return null;
            }
        }

        function saveCachedMedia(files) {
            if (files && files.length) {
                localStorage.setItem('fz_media', JSON.stringify(files));
            }
        }
        
        function getBrowserId() {
            let id = localStorage.getItem('fz_browser_id');
            if (!id || !id.startsWith('BR-') || id.length < 6) {
                const bytes = new Uint8Array(4);
                if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
                    crypto.getRandomValues(bytes);
                } else {
                    for (let i = 0; i < bytes.length; i++) {
                        bytes[i] = Math.floor(Math.random() * 256);
                    }
                }
                id = 'BR-' + Array.from(bytes)
                    .map(b => b.toString(16).padStart(2, '0'))
                    .join('')
                    .toUpperCase();
                localStorage.setItem('fz_browser_id', id);
            }
            return id;
        }

        const pairingScreen = document.getElementById('pairingScreen');
        const qrWrap = document.getElementById('qrWrap');
        const qrImg = document.getElementById('qrImg');
        const qrStatus = document.getElementById('qrStatus');
        const qrHint = document.getElementById('qrHint');

        dlog('Pairing elements found:', {
            pairingScreen: !!pairingScreen
        });

        const stage = document.getElementById('stage');
        const slidesEl = document.getElementById('slides');
        const emptyEl = document.getElementById('empty');
        const counterEl = document.getElementById('counter');
        const prevBtn = document.getElementById('prev');
        const nextBtn = document.getElementById('next');
        const tapLayer = document.getElementById('tap');

        function setPaused(v) {
            paused = v;
            stage.classList.toggle('paused', paused);
            if (paused) {
                stopAutoplay();
                scheduleResume();
            } else {
                clearResume();
                startAutoplay();
            }
        }

        function clearResume() {
            if (resumeTimer) clearTimeout(resumeTimer);
            resumeTimer = null;
        }

        // Once screen is untouch, slideshow should auto start in 5 seconds
        function scheduleResume() {
            clearResume();
            resumeTimer = setTimeout(() => {
                setPaused(false);
            }, 10000);
        }

        function stopAutoplay() {
            dlog('stopAutoplay called');
            if (autoplayTimer) {
                clearTimeout(autoplayTimer);
                autoplayTimer = null;
            }
            const nodes = slidesEl.querySelectorAll('.slide');
            const v = nodes[current]?.querySelector('video');
            if (v) {
                v.onended = null;
                v.pause();
            }
        }

        function startAutoplay() {
            dlog('startAutoplay called, paused:', paused, 'media.length:', media.length);
            if (autoplayTimer) {
                clearTimeout(autoplayTimer);
                autoplayTimer = null;
            }
            const nodes = slidesEl.querySelectorAll('.slide');
            if (!media.length) {
                dlog('startAutoplay: no media, returning');
                return;
            }
            if (paused) {
                dlog('startAutoplay: paused, returning');
                return;
            }
            if (media[current].type === 'video') {
                const video = nodes[current]?.querySelector('video');
                if (video) {
                    dlog('startAutoplay: video', video.currentSrc, 'readyState:', video.readyState, 'networkState:', video.networkState, 'paused:', video.paused);
                    video.loop = false;
                    video.onended = () => {
                        if (autoplayTimer) { clearTimeout(autoplayTimer); autoplayTimer = null; }
                        if (!paused) show(current + 1);
                    };

                    const playVideo = () => {
                        if (paused || !video.paused || video.__playPromise) return;
                        try {
                            if (video.currentTime !== 0) {
                                video.currentTime = 0;
                                dlog('startAutoplay: set currentTime 0, duration:', video.duration);
                            }
                        } catch (e) {
                            dwarn('currentTime reset failed:', e);
                        }
                        video.__playPromise = video.play();
                        video.__playPromise
                            .then(() => {
                                dlog('video playing:', video.currentSrc);
                                video.__playPromise = null;
                            })
                            .catch((err) => {
                                video.__playPromise = null;
                                if (err && err.name !== 'NotAllowedError' && err.name !== 'AbortError') {
                                    dwarn('video play failed:', video.currentSrc, err.name, err.message);
                                    setTimeout(() => show(current + 1), 1000);
                                }
                            });
                    };

                    const scheduleFallback = () => {
                        if (autoplayTimer) clearTimeout(autoplayTimer);
                        const duration = isFinite(video.duration) ? video.duration : 0;
                        if (duration > 0) {
                            autoplayTimer = setTimeout(() => {
                                if (!paused) show(current + 1);
                            }, duration * 1000 + 1000);
                        }
                    };

                    if (video.readyState >= 1) {
                        scheduleFallback();
                        playVideo();
                    } else {
                        video.onloadedmetadata = () => {
                            if (paused) return;
                            if (autoplayTimer) { clearTimeout(autoplayTimer); autoplayTimer = null; }
                            scheduleFallback();
                            playVideo();
                        };
                        video.onerror = () => {
                            dwarn('video load error before play:', media[current].title, video.error);
                            if (!paused) setTimeout(() => show(current + 1), 500);
                        };
                        autoplayTimer = setTimeout(() => { if (!paused) show(current + 1); }, 15000);
                        video.load();
                    }
                    dlog('startAutoplay: video slide, will advance on ended');
                }
            } else {
                autoplayTimer = setTimeout(() => { show(current + 1); }, 10000);
                dlog('startAutoplay: image slide, timeout 10000ms');
            }
        }

        function updateCounter() {
            counterEl.textContent = `${media.length ? current + 1 : 0} / ${media.length}`;
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    dlog(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // Auto-enter fullscreen on load for kiosk mode
        function requestAutoFullscreen() {
            // Try to enter fullscreen automatically
            const requestFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        dlog(`Auto-fullscreen blocked (user interaction required): ${err.message}`);
                    });
                }
            };

            // Try immediately (may be blocked by browser)
            requestFullscreen();

            // Also try on first user interaction
            const enableFullscreenOnInteraction = () => {
                requestFullscreen();
                document.removeEventListener('click', enableFullscreenOnInteraction);
                document.removeEventListener('touchstart', enableFullscreenOnInteraction);
            };

            document.addEventListener('click', enableFullscreenOnInteraction, { once: true });
            document.addEventListener('touchstart', enableFullscreenOnInteraction, { once: true });
        }

        function renderSlides() {
            slidesEl.innerHTML = '';
            if (!media.length) {
                emptyEl.classList.add('show');
                updateCounter();
                stopAutoplay();
                return;
            }
            emptyEl.classList.remove('show');

            media.forEach((f, idx) => {
                const wrap = document.createElement('div');
                wrap.className = 'slide' + (idx === current ? ' active' : '');

                if (f.type === 'image') {
                    const img = document.createElement('img');
                    img.src = getMediaSrc(f);
                    img.alt = f.title;
                    img.onerror = () => {
                        dwarn('image load error:', f.title);
                        if (img.parentElement && img.parentElement.classList.contains('active')) {
                            setTimeout(() => show(current + 1), 500);
                        }
                    };
                    wrap.appendChild(img);
                } else {
                    const vid = document.createElement('video');
                    vid.src = getMediaSrc(f);
                    vid.controls = false;
                    vid.muted = true;
                    vid.playsInline = true;
                    vid.loop = false;
                    vid.setAttribute('playsinline', '');
                    vid.setAttribute('muted', '');
                    vid.setAttribute('preload', 'auto');
                    const logVideo = (e) => dlog(`video [${f.title}] ${e}:`, 'readyState:', vid.readyState, 'networkState:', vid.networkState, 'currentTime:', vid.currentTime, 'duration:', vid.duration, 'paused:', vid.paused, 'currentSrc:', vid.currentSrc);
                    ['loadstart', 'loadeddata', 'canplay', 'canplaythrough', 'playing', 'stalled', 'waiting', 'ended'].forEach(evt => {
                        vid.addEventListener(evt, () => logVideo(evt));
                    });
                    vid.addEventListener('error', () => {
                        dwarn('video error:', f.title, 'code:', vid.error && vid.error.code, 'message:', vid.error && vid.error.message, 'currentSrc:', vid.currentSrc, 'readyState:', vid.readyState, 'networkState:', vid.networkState);
                    });
                    wrap.appendChild(vid);
                }

                slidesEl.appendChild(wrap);
            });

            updateCounter();
        }

        function show(i) {
            if (transitioning) return;
            transitioning = true;
            dlog('show called with index:', i, 'current:', current, 'media.length:', media.length);
            if (!media.length) {
                dlog('show: no media, returning');
                transitioning = false;
                return;
            }
            const prev = current;
            current = (i + media.length) % media.length;
            dlog('show: updated current to:', current);
            const nodes = slidesEl.querySelectorAll('.slide');
            dlog('show: found', nodes.length, 'slide nodes');

            nodes.forEach((n, idx) => {
                n.classList.remove('active', 'prev');
                if (idx === current) {
                    n.classList.add('active');
                } else if (idx === prev) {
                    n.classList.add('prev');
                }
            });

            nodes.forEach((n, idx) => {
                const v = n.querySelector('video');
                if (!v) return;
                if (idx !== current) {
                    v.pause();
                    v.onended = null;
                    v.onerror = null;
                    v.onloadedmetadata = null;
                }
            });

            updateCounter();
            startAutoplay();
            setTimeout(() => { transitioning = false; }, 300);
        }

        // Show cached media from localStorage, re-resolving local URLs through
        // the plugin (the local media server binds a random port each launch,
        // so saved localUrls point at a dead port after restart).
        async function playCachedMedia() {
            const cached = loadCachedMedia();
            if (!cached || !cached.length) return false;
            media = await syncMediaToLocal(cached);
            if (current >= media.length) current = 0;
            pairingScreen.classList.add('hidden');
            stage.style.display = '';
            renderSlides();
            show(current);
            return true;
        }

        async function refresh() {
            dlog('refresh: checking slideshow sources, online:', navigator.onLine);

            // Already playing? Don't re-render on every poll.
            const alreadyPlaying = media.length > 0 && pairingScreen.classList.contains('hidden');

            if (!navigator.onLine) {
                if (!alreadyPlaying) await playCachedMedia();
                return;
            }

            if (deviceToken && deviceId) {
                dlog('refresh: using existing pairing');
                let res, data;
                try {
                    res = await fetch(
                        `/api/device/${encodeURIComponent(deviceId)}/slideshow/?token=${encodeURIComponent(deviceToken)}`
                    );
                    data = await res.json();
                } catch (err) {
                    // Network failed even though navigator.onLine was true
                    // (e.g. WiFi up but no WAN). Fall back to cached media.
                    dwarn('refresh: slideshow fetch failed, trying cache', err);
                    if (!alreadyPlaying) await playCachedMedia();
                    return;
                }
                if (data.success) {
                    devicePaired = true;
                    const currentIds = JSON.stringify(media.map(f => f.id));
                    const newIds = JSON.stringify(data.files.map(f => f.id));
                    if (currentIds === newIds && media.length === data.files.length && pairingScreen.classList.contains('hidden')) {
                        // No change; don't re-render, keep current playback running
                        return;
                    }
                    dlog('refresh: slideshow changed, syncing diff');
                    stopAutoplay();
                    const currentId = media.length && media[current] ? media[current].id : null;
                    // Only show the sync screen if the sync takes a moment —
                    // cached diffs resolve instantly and shouldn't flash it.
                    // First claim: the user is staring at the QR screen, so show
                    // the sync screen immediately. Later diffs resolve instantly
                    // from cache — only flash the sync screen if they take a moment.
                    const firstClaim = !pairingScreen.classList.contains('hidden');
                    const loadingTimer = firstClaim ? null : setTimeout(showLoading, 400);
                    if (firstClaim) showLoading();
                    media = await syncMediaToLocal(data.files);
                    if (loadingTimer) clearTimeout(loadingTimer);
                    hideLoading();
                    saveCachedMedia(media);
                    cacheMediaUrls(media);
                    // Keep playing the same slide if it survived the change
                    // instead of restarting the slideshow from the top.
                    const kept = currentId == null ? -1 : media.findIndex(f => f.id === currentId);
                    current = kept >= 0 ? kept : 0;
                    pairingScreen.classList.add('hidden');
                    stage.style.display = '';
                    renderSlides();
                    show(current);
                    setPaused(false);
                    return;
                }
                if (res.status === 404 && data.device_id) {
                    // Device exists but isn't linked to a user yet — keep the
                    // same QR on screen and keep polling (fast while unclaimed).
                    return;
                }
                if (res.status === 403 || res.status === 404) {
                    dlog('refresh: device token invalid, showing QR');
                    stopAutoplay();
                    stage.style.display = 'none';
                    pairingScreen.classList.remove('hidden');
                    qrWrap.style.display = 'block';
                    deviceToken = null;
                    devicePaired = false;
                    localStorage.removeItem('fz_device_token');
                    await requestQrPairing();
                    return;
                }
                return;
            }

            dlog('refresh: no device token, showing QR');
            pairingScreen.classList.remove('hidden');
            qrWrap.style.display = 'block';
            await requestQrPairing();
        }

        async function requestQrPairing() {
            if (qrStatus) qrStatus.textContent = 'Creating display...';
            const existingQr = deviceId && deviceToken && deviceId.startsWith('QR-');
            if (!existingQr) {
                const browserId = getBrowserId();
                try {
                    const res = await fetch(`/api/pairing/new/?browser_id=${encodeURIComponent(browserId)}`);
                    const data = await res.json();
                    if (data.success) {
                        deviceId = data.device_id;
                        deviceToken = data.token;
                        localStorage.setItem('fz_device_id', deviceId);
                        localStorage.setItem('fz_device_token', deviceToken);
                        dlog('QR pairing created:', deviceId);
                    } else {
                        dwarn('QR pairing failed:', data.error);
                        if (qrStatus) qrStatus.textContent = `Create failed: ${data.error}`;
                        return;
                    }
                } catch (err) {
                    derror('QR pairing error:', err);
                    if (qrStatus) qrStatus.textContent = `Create error: ${err.message}`;
                    return;
                }
            }

            const setupUrl = deviceToken
                ? `${window.location.origin}/setup/?device_id=${encodeURIComponent(deviceId)}&token=${encodeURIComponent(deviceToken)}`
                : '';
            await showQrImage(setupUrl);
        }

        prevBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            show(current - 1);
            scheduleResume();
        });
        nextBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            show(current + 1);
            scheduleResume();
        });

        // Touch behavior:
        // - on touch -> pause and show controls
        // - when touch ends -> keep paused and resume after 5s
        
        // Pointer events (modern browsers)
        tapLayer.addEventListener('pointerdown', (e) => {
            dlog('pointerdown event fired');
            e.preventDefault();
            setPaused(true);
        });
        tapLayer.addEventListener('pointerup', (e) => {
            dlog('pointerup event fired');
            e.preventDefault();
            // user stopped touching; already paused, resume timer is scheduled
        });
        tapLayer.addEventListener('pointercancel', (e) => {
            dlog('pointercancel event fired');
            e.preventDefault();
            scheduleResume();
        });

        // Touch events (Safari iOS support)
        tapLayer.addEventListener('touchstart', (e) => {
            dlog('touchstart event fired');
            e.preventDefault();
            setPaused(true);
        }, { passive: false });
        tapLayer.addEventListener('touchend', (e) => {
            dlog('touchend event fired');
            e.preventDefault();
            // user stopped touching; already paused, resume timer is scheduled
        }, { passive: false });
        
        // Prevent context menu on long press
        tapLayer.addEventListener('contextmenu', (e) => {
            dlog('contextmenu event fired');
            e.preventDefault();
            return false;
        });

        function showSplash() {
            const splash = document.getElementById('splashScreen');
            const logo = document.getElementById('splashLogo');
            splash.classList.remove('hidden');
            return new Promise((resolve) => {
                let minDone = false;
                let imgDone = false;
                const maybeFinish = () => {
                    if (minDone && imgDone) {
                        splash.classList.add('hidden');
                        resolve();
                    }
                };
                setTimeout(() => { minDone = true; maybeFinish(); }, 3000);
                if (logo.complete) {
                    imgDone = true;
                    maybeFinish();
                } else {
                    logo.onload = () => { imgDone = true; maybeFinish(); };
                    logo.onerror = () => { imgDone = true; maybeFinish(); };
                }
            });
        }

        function showQrImage(setupUrl) {
            if (!setupUrl) return;
            if (qrStatus) qrStatus.textContent = 'Loading QR code...';
            qrImg.src = `/api/qr/?data=${encodeURIComponent(setupUrl)}`;
            qrImg.onload = () => {
                if (qrStatus) qrStatus.textContent = '';
            };
            qrImg.onerror = () => {
                derror('Failed to load same-origin QR image');
                if (qrStatus) qrStatus.textContent = 'Could not load QR. Please refresh.';
            };
        }

        async function requestQrPairing() {
            if (qrStatus) qrStatus.textContent = 'Creating display...';
            const existingQr = deviceId && deviceToken && deviceId.startsWith('QR-');
            if (!existingQr) {
                const browserId = getBrowserId();
                try {
                    const res = await fetch(`/api/pairing/new/?browser_id=${encodeURIComponent(browserId)}`);
                    const data = await res.json();
                    if (data.success) {
                        deviceId = data.device_id;
                        deviceToken = data.token;
                        localStorage.setItem('fz_device_id', deviceId);
                        localStorage.setItem('fz_device_token', deviceToken);
                        dlog('QR pairing created:', deviceId);
                    } else {
                        dwarn('QR pairing failed:', data.error);
                        if (qrStatus) qrStatus.textContent = `Create failed: ${data.error}`;
                        return;
                    }
                } catch (err) {
                    derror('QR pairing error:', err);
                    if (qrStatus) qrStatus.textContent = `Create error: ${err.message}`;
                    return;
                }
            }

            const setupUrl = deviceToken
                ? `${window.location.origin}/setup/?device_id=${encodeURIComponent(deviceId)}&token=${encodeURIComponent(deviceToken)}`
                : '';
            await showQrImage(setupUrl);
        }

        // Poll fast while the QR screen is up so linking feels instant, then
        // drop to a slow cadence once media is playing.
        const POLL_FAST = 4000;
        const POLL_SLOW = 30000;
        function poll() {
            clearTimeout(pollTimer);
            pollTimer = setTimeout(runAndRequeue, devicePaired ? POLL_SLOW : POLL_FAST);
        }
        function runAndRequeue() {
            Promise.resolve(refresh()).catch(() => {}).then(poll);
        }

        function startApp() {
            dlog('Initial load: starting app after splash');

            if (deviceId && deviceToken && deviceId.startsWith('QR-')) {
                // QR device: if it was already claimed, cached media covers the
                // QR screen instantly; otherwise the QR stays and fast polling
                // picks up the link within a few seconds.
                playCachedMedia();
                requestQrPairing().then(runAndRequeue);
            } else if (deviceId && deviceToken) {
                // Paired device (non-QR id): keep pairing + media cache and go
                // straight to refresh — offline launches can play cached media.
                devicePaired = true;
                playCachedMedia();
                runAndRequeue();
            } else {
                // Start fresh with a QR code
                localStorage.removeItem('fz_device_token');
                localStorage.removeItem('fz_device_id');
                localStorage.removeItem('fz_pairing_id');
                localStorage.removeItem('fz_media');
                deviceToken = null;
                deviceId = null;
                requestQrPairing().then(runAndRequeue);
            }

            requestAutoFullscreen();
            if (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.KeepAwake) {
                Capacitor.Plugins.KeepAwake.keepAwake().catch(() => {});
            }
        }

        // Keep list updated
        showSplash().then(startApp);

        if (!Capacitor.isNativePlatform() && 'serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').catch(() => {});
        }
    </script>
</body>
</html>
