<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Times - FZDigitals</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            background: #0b1020;
            color: #e8eaf0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
        }
        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle {
            color: rgba(232,234,240,0.7);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: rgba(232,234,240,0.8);
        }
        .time-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .time-row input, .time-row select {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: #e8eaf0;
            font-size: 14px;
            text-align: center;
        }
        .time-row input { width: 60px; }
        .time-row select { width: 70px; }
        .time-row input:focus, .time-row select:focus {
            outline: none;
            border-color: #7c5cff;
        }
        .colon { color: #e8eaf0; font-size: 16px; }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #7c5cff;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
        .submit-btn:hover { background: #6a4ce6; }
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .message.success { background: rgba(76,175,80,0.15); color: #c8e6c9; }
        .message.error { background: rgba(244,67,54,0.15); color: #ffcdd2; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(232,234,240,0.7);
            text-decoration: none;
            font-size: 14px;
        }
        .back-link:hover { color: #e8eaf0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prayer Times</h1>
        <p class="subtitle">{{ mosque.name }} - {{ today }}</p>

        {% if messages %}
            {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {% for f in prayer_fields %}
            <div class="form-group">
                <label for="id_{{ f.name }}_hour">{{ f.label }}</label>
                <div class="time-row">
                    <input type="number" name="{{ f.name }}_hour" id="id_{{ f.name }}_hour" min="1" max="12" placeholder="HH" value="{{ f.hour }}">
                    <span class="colon">:</span>
                    <input type="number" name="{{ f.name }}_minute" id="id_{{ f.name }}_minute" min="0" max="59" placeholder="MM" value="{{ f.minute }}">
                    <select name="{{ f.name }}_ampm" id="id_{{ f.name }}_ampm">
                        <option value="AM" {% if f.ampm == 'AM' %}selected{% endif %}>AM</option>
                        <option value="PM" {% if f.ampm == 'PM' %}selected{% endif %}>PM</option>
                    </select>
                </div>
            </div>
            {% endfor %}
            <button type="submit" class="submit-btn">Save Prayer Times</button>
        </form>

        <a href="/{{ request.user.id }}/" class="back-link">Back to Dashboard</a>
    </div>
</body>
</html>
