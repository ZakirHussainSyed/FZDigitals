<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mosque Map - FZ Screens</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
        #map { width: 100%; height: 100%; background: #111; }
        .mosque-pin {
            position: relative;
            background: #1a237e;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 8px 12px;
            min-width: 120px;
            text-align: center;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.45);
            white-space: nowrap;
            transform: translate(-50%, -100%);
            margin-top: -16px;
        }
        .mosque-pin::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #1a237e transparent transparent transparent;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }
        .mosque-pin strong { display: block; font-size: 16px; font-weight: 700; margin-bottom: 3px; }
        .mosque-pin .next-salah { display: block; font-size: 13px; color: #e0e0ff; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #fff;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-header {
            background: #1a237e;
            color: #fff;
            padding: 18px 20px;
            position: relative;
        }
        .modal-header h2 { font-size: 20px; margin: 0; padding-right: 32px; }
        .modal-distance {
            font-size: 13px;
            color: rgba(255,255,255,0.9);
            margin-top: 4px;
            display: none;
        }
        .modal-header .close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: transparent;
            border: 0;
            color: #fff;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }
        .modal-body {
            padding: 20px;
        }
        .modal-address {
            color: #555;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .maps-link {
            color: #1a237e;
            text-decoration: underline;
            word-break: break-word;
        }
        .maps-link:hover, .maps-link:active {
            color: #0d47a1;
        }
        .timing-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 16px;
        }
        .timing-row:last-child { border-bottom: 0; }
        .timing-label { color: #333; font-weight: 600; }
        .timing-value { color: #1a237e; font-weight: 700; }
        .loader {
            position: fixed;
            inset: 0;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            font-size: 16px;
        }
        .leaflet-popup-content { margin: 0; }
        .search-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1001;
            display: flex;
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
        .search-input {
            flex: 1;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            outline: none;
        }
        .search-btn, .near-btn {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: #1a237e;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            white-space: nowrap;
        }
        .near-btn { background: #0d47a1; }
        .search-btn:hover, .near-btn:hover { opacity: 0.92; }
        .status-msg {
            position: absolute;
            top: 66px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="loader" class="loader">Loading mosques...</div>
    <div class="search-bar">
        <input type="text" id="search-input" class="search-input" placeholder="Enter zipcode or city name">
        <button id="search-btn" class="search-btn">Search</button>
        <button id="near-btn" class="near-btn">Near Me</button>
    </div>
    <div id="status-msg" class="status-msg"></div>
    <div id="map"></div>

    <div id="modal" class="modal-overlay" aria-hidden="true">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Mosque</h2>
                <div class="modal-distance" id="modal-distance"></div>
                <button class="close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modal-address" class="modal-address"></div>
                <div class="timing-row"><span class="timing-label">Fajr</span><span class="timing-value" id="t-fajr">-</span></div>
                <div class="timing-row"><span class="timing-label">Sunrise</span><span class="timing-value" id="t-sunrise">-</span></div>
                <div class="timing-row"><span class="timing-label">Dhuhr</span><span class="timing-value" id="t-dhuhr">-</span></div>
                <div class="timing-row"><span class="timing-label">Asr</span><span class="timing-value" id="t-asr">-</span></div>
                <div class="timing-row"><span class="timing-label">Sunset</span><span class="timing-value" id="t-sunset">-</span></div>
                <div class="timing-row"><span class="timing-label">Maghrib</span><span class="timing-value" id="t-maghrib">-</span></div>
                <div class="timing-row"><span class="timing-label">Isha</span><span class="timing-value" id="t-isha">-</span></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        (async function() {
            const loader = document.getElementById('loader');
            const modal = document.getElementById('modal');
            const closeBtn = modal.querySelector('.close');
            const statusMsg = document.getElementById('status-msg');

            function showStatus(text, seconds) {
                statusMsg.textContent = text;
                statusMsg.style.display = 'block';
                if (seconds) {
                    setTimeout(function() { statusMsg.style.display = 'none'; }, seconds * 1000);
                }
            }

            function closeModal() {
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
            }

            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeModal();
            });

            function setUserLocation(lat, lon) {
                userLat = lat;
                userLon = lon;
                if (userMarker) {
                    map.removeLayer(userMarker);
                }
                userMarker = L.circleMarker([lat, lon], {
                    radius: 8,
                    color: '#ffffff',
                    weight: 2,
                    fillColor: '#2196F3',
                    fillOpacity: 1,
                    opacity: 1
                }).addTo(map);
                userMarker.bindTooltip('You are here', {direction: 'top', offset: [0, -8]});

                allMosques.forEach(function(m) {
                    m.distance_km = haversine(lat, lon, m.latitude, m.longitude);
                });
            }

            function openModal(mosque) {
                document.getElementById('modal-title').textContent = mosque.name;
                const addrEl = document.getElementById('modal-address');
                const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mosque.latitude + ',' + mosque.longitude)}`;
                if (mosque.address) {
                    addrEl.innerHTML = `<a href="${mapsUrl}" target="_blank" rel="noopener" class="maps-link">${mosque.address}</a>`;
                } else {
                    addrEl.innerHTML = `<a href="${mapsUrl}" target="_blank" rel="noopener" class="maps-link">Get directions</a>`;
                }
                const timings = mosque.timings || {};
                document.getElementById('t-fajr').textContent = timings.fajr || '-';
                document.getElementById('t-sunrise').textContent = timings.sunrise || '-';
                document.getElementById('t-dhuhr').textContent = timings.dhuhr || '-';
                document.getElementById('t-asr').textContent = timings.asr || '-';
                document.getElementById('t-sunset').textContent = timings.sunset || '-';
                document.getElementById('t-maghrib').textContent = timings.maghrib || '-';
                document.getElementById('t-isha').textContent = timings.isha || '-';

                const distEl = document.getElementById('modal-distance');
                if (userLat !== null && userLon !== null) {
                    const km = mosque.distance_km || haversine(userLat, userLon, mosque.latitude, mosque.longitude);
                    const mi = km * 0.621371;
                    distEl.textContent = 'Distance: ' + km.toFixed(1) + ' km (' + mi.toFixed(1) + ' mi)';
                    distEl.style.display = 'block';
                } else {
                    distEl.style.display = 'none';
                }

                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
            }

            function haversine(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }

            function createIcon(m) {
                const nextLabel = m.next_salah && m.next_salah.name
                    ? `<span class="next-salah">${m.next_salah.name}: ${m.next_salah.time}</span>`
                    : '';
                const html = `<strong>${m.name}</strong>${nextLabel}`;
                return L.divIcon({
                    className: '',
                    html: `<div class="mosque-pin">${html}</div>`,
                    iconSize: null,
                    iconAnchor: [0, 0]
                });
            }

            let allMosques = [];
            let markers = L.layerGroup();
            let userLat = null;
            let userLon = null;
            let userMarker = null;

            function clearMarkers() {
                markers.clearLayers();
            }

            function renderMosques(mosques) {
                clearMarkers();
                const bounds = [];
                mosques.forEach(function(m) {
                    bounds.push([m.latitude, m.longitude]);
                    const marker = L.marker([m.latitude, m.longitude], {icon: createIcon(m)});
                    marker.on('click', function() { openModal(m); });
                    markers.addLayer(marker);
                });
                if (mosques.length > 0) {
                    map.fitBounds(bounds, {padding: [40, 40], maxZoom: 14});
                }
            }

            function filterByDistance(centerLat, centerLon, radiusKm) {
                const filtered = allMosques.filter(function(m) {
                    return haversine(centerLat, centerLon, m.latitude, m.longitude) <= radiusKm;
                }).sort(function(a, b) {
                    return haversine(centerLat, centerLon, a.latitude, a.longitude) -
                           haversine(centerLat, centerLon, b.latitude, b.longitude);
                });
                if (filtered.length === 0) {
                    showStatus('No mosques found within ' + radiusKm + ' km of this area.', 4);
                } else {
                    statusMsg.style.display = 'none';
                }
                renderMosques(filtered);
            }

            async function geocodeAndFocus(query) {
                if (!query.trim()) return;
                try {
                    const url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query);
                    const res = await fetch(url, {headers: {'Accept-Language': 'en'}});
                    const results = await res.json();
                    if (!results || !results.length) {
                        showStatus('Location not found.', 3);
                        return;
                    }
                    const lat = parseFloat(results[0].lat);
                    const lon = parseFloat(results[0].lon);
                    map.setView([lat, lon], 13);
                    filterByDistance(lat, lon, 50);
                } catch (err) {
                    console.error('Geocode error:', err);
                    showStatus('Search failed. Please try again.', 3);
                }
            }

            function onNearMe() {
                if (!navigator.geolocation) {
                    showStatus('Geolocation is not supported by your browser.', 3);
                    return;
                }
                showStatus('Finding your location...', 5);
                navigator.geolocation.getCurrentPosition(function(position) {
                    statusMsg.style.display = 'none';
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    setUserLocation(lat, lon);
                    map.setView([lat, lon], 13);
                    filterByDistance(lat, lon, 50);
                }, function() {
                    showStatus('Could not get your location.', 3);
                });
            }

            let map;
            try {
                const res = await fetch('/api/public/mosques/');
                const data = await res.json();
                loader.style.display = 'none';

                map = L.map('map').setView([20, 0], 2);
                markers.addTo(map);

                L.tileLayer('{{ tile_url }}', {
                    maxZoom: 19,
                    subdomains: 'a,b,c',
                    attribution: '{{ attribution|safe }}'
                }).addTo(map);

                document.getElementById('search-btn').addEventListener('click', function() {
                    geocodeAndFocus(document.getElementById('search-input').value);
                });
                document.getElementById('search-input').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') geocodeAndFocus(e.target.value);
                });
                document.getElementById('near-btn').addEventListener('click', onNearMe);

                if (!data.success || !data.mosques || !data.mosques.length) {
                    showStatus('No mosques found.', 4);
                    return;
                }

                allMosques = data.mosques;
                renderMosques(allMosques);

                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(function(position) {
                        setUserLocation(position.coords.latitude, position.coords.longitude);
                    });
                }
            } catch (err) {
                console.error('Map load error:', err);
                loader.textContent = 'Error loading map.';
                loader.style.display = 'flex';
            }
        })();
    </script>
</body>
</html>
