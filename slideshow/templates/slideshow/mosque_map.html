<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Mosque Map - {{ brand.name }}</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
        #map { width: 100%; height: 100%; background: #111; }
        .mosque-pin {
            position: relative;
            background: #1b5e20;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 8px 12px;
            min-width: 120px;
            text-align: center;
            font-size: 14px;
            line-height: 1.4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.45);
            white-space: nowrap;
            transform: translate(-50%, -100%);
            margin-top: -16px;
        }
        .mosque-pin::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #1b5e20 transparent transparent transparent;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
        }
        .mosque-pin strong { display: block; font-size: 12px; font-weight: 600; margin-top: 2px; }
        .mosque-pin .next-salah { display: block; font-size: 17px; font-weight: 700; color: #ffd54f; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 16px;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: #e8f5e9;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            max-height: 90vh;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-header {
            background: #1b5e20;
            color: #fff;
            padding: 18px 20px;
            position: relative;
        }
        .modal-header h2 { font-size: 20px; margin: 0; padding-right: 32px; }
        .modal-distance {
            font-size: 13px;
            color: rgba(255,255,255,0.9);
            margin-top: 4px;
            display: none;
        }
        .modal-header .close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: transparent;
            border: 0;
            color: #fff;
            font-size: 28px;
            line-height: 1;
            cursor: pointer;
        }
        .modal-body {
            padding: 20px;
        }
        .modal-address {
            color: #333;
            font-size: 14px;
            margin-bottom: 18px;
        }
        .maps-link {
            color: #333;
            text-decoration: underline;
            word-break: break-word;
        }
        .maps-link:hover, .maps-link:active {
            color: #555;
        }
        .timing-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(27,94,32,0.15);
            font-size: 16px;
        }
        .timing-row:last-child { border-bottom: 0; }
        .timing-row.next {
            background: rgba(27,94,32,0.12);
            border-radius: 8px;
            padding-left: 8px;
            padding-right: 8px;
            margin-left: -8px;
            margin-right: -8px;
        }
        .timing-label { color: #333; font-weight: 600; }
        .timing-icon { flex: 1; text-align: center; font-size: 18px; }
        .timing-value { color: #333; font-weight: 700; }
        .timing-row.sunrise span, .timing-row.sunset span { color: #1e90ff; }
        .loader {
            position: fixed;
            inset: 0;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            font-size: 16px;
        }
        .loader.splash { background: #fff; }
        .loader.splash img { width: 100%; height: 100%; object-fit: cover; }
        .leaflet-popup-content { margin: 0; }
        .search-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            z-index: 1001;
            display: flex;
            gap: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
        .search-box { position: relative; flex: 1; }
        .search-input {
            width: 100%;
            padding: 12px 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            outline: none;
            box-sizing: border-box;
        }
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: 6px;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            overflow: hidden;
            display: none;
        }
        .search-dropdown.open { display: block; }
        .dropdown-item {
            padding: 12px 14px;
            font-size: 14px;
            color: #222;
            cursor: pointer;
            border-bottom: 1px solid rgba(0,0,0,0.06);
        }
        .dropdown-item:last-child { border-bottom: none; }
        .dropdown-item:hover { background: rgba(26,35,126,0.08); }
        .dropdown-item.current-loc { font-weight: 600; color: #0d47a1; }
        .dropdown-item .dd-main { font-weight: 600; }
        .dropdown-item .dd-sub { font-size: 12px; color: #666; margin-top: 2px; }
        .login-btn {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: #0e9f8a;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            white-space: nowrap;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .login-btn:hover { opacity: 0.92; }
        .area-btn {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            background: #1a237e;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
            display: none;
            white-space: nowrap;
        }
        .status-msg {
            position: absolute;
            top: 66px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1001;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
        }
        .brand-footer {
            position: absolute;
            bottom: 8px;
            left: 8px;
            z-index: 1001;
            background: rgba(255,255,255,0.85);
            color: rgba(0,0,0,0.55);
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .brand-footer a {
            color: #1a237e;
            font-weight: 700;
            text-decoration: none;
        }
        .brand-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="loader" class="loader{% if brand.key == 'takbir' %} splash{% endif %}">
        {% if brand.key == 'takbir' %}<img src="/static/takbir_flash.png" alt="Takbir-al-Ula">{% else %}Loading mosques...{% endif %}
    </div>
    <div class="search-bar">
        <div class="search-box">
            <input type="text" id="search-input" class="search-input" placeholder="Zipcode, city, or address" autocomplete="off">
            <div id="search-dropdown" class="search-dropdown">
                <div class="dropdown-item current-loc" id="dd-current-loc">&#x1F4CD; Current Location</div>
                <div id="dd-results"></div>
            </div>
        </div>
        {% if request.user.is_authenticated %}
        <a href="{% url 'user-dashboard' request.user.id %}" class="login-btn">Dashboard</a>
        {% else %}
        <a href="{% url 'django_login' %}" class="login-btn">Log In</a>
        {% endif %}
    </div>
    <div id="status-msg" class="status-msg"></div>
    <button id="search-area-btn" class="area-btn">Search this area</button>
    <div id="map"></div>
    <div class="brand-footer">Powered by <a href="https://fzscreens.com" target="_blank" rel="noopener">fzscreens.com</a></div>

    <div id="modal" class="modal-overlay" aria-hidden="true">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modal-title">Mosque</h2>
                <div class="modal-distance" id="modal-distance"></div>
                <button class="close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modal-address" class="modal-address"></div>
                <div id="modal-website" class="modal-address"></div>
                <div class="timing-row"><span class="timing-label">Fajr</span><span class="timing-value" id="t-fajr">-</span></div>
                <div class="timing-row sunrise"><span class="timing-label">Sunrise</span><span class="timing-value" id="t-sunrise">-</span></div>
                <div class="timing-row"><span class="timing-label">Dhuhr</span><span class="timing-value" id="t-dhuhr">-</span></div>
                <div class="timing-row"><span class="timing-label">Asr</span><span class="timing-value" id="t-asr">-</span></div>
                <div class="timing-row sunset"><span class="timing-label">Sunset</span><span class="timing-value" id="t-sunset">-</span></div>
                <div class="timing-row"><span class="timing-label">Maghrib</span><span class="timing-value" id="t-maghrib">-</span></div>
                <div class="timing-row"><span class="timing-label">Isha</span><span class="timing-value" id="t-isha">-</span></div>
                <div class="timing-row"><span class="timing-label">Jumu'ah 1</span><span class="timing-value" id="t-jummah">--</span></div>
                <div class="timing-row"><span class="timing-label">Jumu'ah 2</span><span class="timing-value" id="t-jummah2">--</span></div>
                <div class="timing-row"><span class="timing-label">Jumu'ah 3</span><span class="timing-value" id="t-jummah3">--</span></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        (async function() {
            const loader = document.getElementById('loader');
            const modal = document.getElementById('modal');
            const closeBtn = modal.querySelector('.close');
            const statusMsg = document.getElementById('status-msg');
            const searchInput = document.getElementById('search-input');
            const dropdown = document.getElementById('search-dropdown');
            const ddResults = document.getElementById('dd-results');
            const areaBtn = document.getElementById('search-area-btn');

            function showStatus(text, seconds) {
                statusMsg.textContent = text;
                statusMsg.style.display = 'block';
                if (seconds) {
                    setTimeout(function() { statusMsg.style.display = 'none'; }, seconds * 1000);
                }
            }

            function closeModal() {
                openMosque = null;
                modal.classList.remove('open');
                modal.setAttribute('aria-hidden', 'true');
            }

            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeModal();
            });

            function setUserLocation(lat, lon) {
                userLat = lat;
                userLon = lon;
                if (userMarker) {
                    map.removeLayer(userMarker);
                }
                userMarker = L.circleMarker([lat, lon], {
                    radius: 8,
                    color: '#ffffff',
                    weight: 2,
                    fillColor: '#2196F3',
                    fillOpacity: 1,
                    opacity: 1
                }).addTo(map);
                userMarker.bindTooltip('You are here', {direction: 'top', offset: [0, -8]});

                allMosques.forEach(function(m) {
                    m.distance_km = haversine(lat, lon, m.latitude, m.longitude);
                });
            }

            function openModal(mosque) {
                openMosque = mosque;
                document.getElementById('modal-title').textContent = mosque.name;
                const addrEl = document.getElementById('modal-address');
                const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mosque.latitude + ',' + mosque.longitude)}`;
                if (mosque.address) {
                    addrEl.innerHTML = `<strong>Get Direction:</strong> <a href="${mapsUrl}" target="_blank" rel="noopener" class="maps-link">${mosque.address}</a>`;
                } else {
                    addrEl.innerHTML = `<a href="${mapsUrl}" target="_blank" rel="noopener" class="maps-link">Get directions</a>`;
                }
                const webEl = document.getElementById('modal-website');
                webEl.textContent = '';
                if (mosque.website) {
                    const lbl = document.createElement('strong');
                    lbl.textContent = 'Website: ';
                    const a = document.createElement('a');
                    a.href = mosque.website;
                    a.target = '_blank';
                    a.rel = 'noopener';
                    a.className = 'maps-link';
                    a.textContent = mosque.website;
                    webEl.appendChild(lbl);
                    webEl.appendChild(a);
                    webEl.style.display = 'block';
                } else {
                    webEl.style.display = 'none';
                }
                const timings = mosque.timings || {};
                document.getElementById('t-fajr').textContent = timings.fajr || '-';
                document.getElementById('t-sunrise').textContent = timings.sunrise || '-';
                document.getElementById('t-dhuhr').textContent = timings.dhuhr || '-';
                document.getElementById('t-asr').textContent = timings.asr || '-';
                document.getElementById('t-sunset').textContent = timings.sunset || '-';
                document.getElementById('t-maghrib').textContent = timings.maghrib || '-';
                document.getElementById('t-isha').textContent = timings.isha || '-';
                document.getElementById('t-jummah').textContent = timings.jummah || '--';
                document.getElementById('t-jummah2').textContent = timings.jummah2 || '--';
                document.getElementById('t-jummah3').textContent = timings.jummah3 || '--';

                modal.querySelectorAll('.timing-row').forEach(function(r) { r.classList.remove('next'); });
                if (mosque.next_salah && mosque.next_salah.name) {
                    // Display name -> timings key: 'Jumu'ah 2' -> 'jummah2' -> id 't-jummah2'
                    const NEXT_KEY = {"Jumu'ah": 'jummah', "Jumu'ah 2": 'jummah2', "Jumu'ah 3": 'jummah3'};
                    const nk = NEXT_KEY[mosque.next_salah.name]
                        || mosque.next_salah.name.toLowerCase().replace(/\s+/g, '');
                    const nextEl = document.getElementById('t-' + nk);
                    if (nextEl) nextEl.closest('.timing-row').classList.add('next');
                }

                const distEl = document.getElementById('modal-distance');
                if (userLat !== null && userLon !== null) {
                    const km = mosque.distance_km || haversine(userLat, userLon, mosque.latitude, mosque.longitude);
                    const mi = km * 0.621371;
                    distEl.textContent = 'Distance: ' + mi.toFixed(1) + ' mi (' + km.toFixed(1) + ' km)';
                    distEl.style.display = 'block';
                } else {
                    distEl.style.display = 'none';
                }

                modal.classList.add('open');
                modal.setAttribute('aria-hidden', 'false');
            }

            function haversine(lat1, lon1, lat2, lon2) {
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                          Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                          Math.sin(dLon/2) * Math.sin(dLon/2);
                return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            }

            function createIcon(m) {
                const nextLabel = m.next_salah && m.next_salah.name
                    ? `<span class="next-salah">${m.next_salah.name}: ${m.next_salah.time}</span>`
                    : '';
                const html = `${nextLabel}<strong>${m.name}</strong>`;
                return L.divIcon({
                    className: '',
                    html: `<div class="mosque-pin">${html}</div>`,
                    iconSize: null,
                    iconAnchor: [0, 0]
                });
            }

            let allMosques = [];
            let openMosque = null;
            const MAP_CACHE_KEY = 'fz_mosque_map_v1';
            let markers = L.layerGroup();
            let userLat = null;
            let userLon = null;
            let userMarker = null;

            const NEAR_ME_ZOOM = 14; // Google-style local view (~3-4 km across)
            const AUTO_NEAR_ME_HOSTS = ['takbir-al-ula.fzscreens.com', 'qama.fzscreens.com', 'takbir-al-ula.com', 'www.takbir-al-ula.com'];
            // Coarse (network) location is plenty for a near-me view and returns
            // fast; without a timeout the promise can hang forever in WebViews.
            const GEO_OPTS = {enableHighAccuracy: false, timeout: 10000, maximumAge: 300000};

            function clearMarkers() {
                markers.clearLayers();
            }

            // Google-style density: at a big viewport show one pin per
            // screen cell instead of every fetched mosque; zooming in
            // shrinks the cells so more pins appear on the next render.
            const VIEW_GRID = 6; // ~36 pin slots across the visible map
            function thinForView(list) {
                if (!map || list.length <= VIEW_GRID * VIEW_GRID) return list;
                const b = map.getBounds();
                const latH = (b.getNorth() - b.getSouth()) / VIEW_GRID;
                const lngW = (b.getEast() - b.getWest()) / VIEW_GRID;
                if (!(latH > 0) || !(lngW > 0)) return list;
                const s = b.getSouth(), w = b.getWest();
                const seen = {}, out = [];
                list.forEach(function(m) {
                    const k = Math.floor((m.latitude - s) / latH) + ':' +
                              Math.floor((m.longitude - w) / lngW);
                    if (!seen[k]) { seen[k] = true; out.push(m); }
                });
                return out;
            }

            function renderMosques(mosques, fitToMarkers) {
                clearMarkers();
                const bounds = [];
                mosques.forEach(function(m) { bounds.push([m.latitude, m.longitude]); });
                if (mosques.length > 0 && fitToMarkers !== false) {
                    map.fitBounds(bounds, {padding: [40, 40], maxZoom: 14});
                }
                thinForView(mosques).forEach(function(m) {
                    const marker = L.marker([m.latitude, m.longitude], {icon: createIcon(m)});
                    marker.mosqueRef = m;
                    marker.on('click', function() { openModal(m); });
                    markers.addLayer(marker);
                });
            }

            function filterByDistance(centerLat, centerLon, radiusMiles, fitToMarkers) {
                const radiusKm = radiusMiles * 1.60934;
                const filtered = allMosques.filter(function(m) {
                    return haversine(centerLat, centerLon, m.latitude, m.longitude) <= radiusKm;
                }).sort(function(a, b) {
                    return haversine(centerLat, centerLon, a.latitude, a.longitude) -
                           haversine(centerLat, centerLon, b.latitude, b.longitude);
                });
                if (filtered.length === 0) {
                    showStatus('No mosques found within ' + radiusMiles + ' miles of this area.', 4);
                } else {
                    statusMsg.style.display = 'none';
                }
                renderMosques(filtered, fitToMarkers);
            }

            async function fetchSuggestions(query) {
                try {
                    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(query);
                    const res = await fetch(url, {headers: {'Accept-Language': 'en'}});
                    const results = await res.json();
                    ddResults.innerHTML = '';
                    (results || []).forEach(function(r) {
                        const parts = (r.display_name || '').split(', ');
                        const item = document.createElement('div');
                        item.className = 'dropdown-item';
                        const main = document.createElement('div');
                        main.className = 'dd-main';
                        main.textContent = parts.slice(0, 2).join(', ');
                        const sub = document.createElement('div');
                        sub.className = 'dd-sub';
                        sub.textContent = parts.slice(2).join(', ');
                        item.appendChild(main);
                        item.appendChild(sub);
                        item.addEventListener('click', async function() {
                            hideDropdown();
                            searchInput.value = parts.slice(0, 2).join(', ');
                            const lat = parseFloat(r.lat);
                            const lon = parseFloat(r.lon);
                            map.setView([lat, lon], 13);
                            await fetchAround(lat, lon, 31); // fresh ~50 km viewport
                            filterByDistance(lat, lon, 31); // ~50 km
                        });
                        ddResults.appendChild(item);
                    });
                } catch (err) {
                    console.error('Suggest error:', err);
                }
            }

            function hideDropdown() { dropdown.classList.remove('open'); }

            async function geocodeAndFocus(query) {
                if (!query.trim()) return;
                try {
                    const url = 'https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(query);
                    const res = await fetch(url, {headers: {'Accept-Language': 'en'}});
                    const results = await res.json();
                    if (!results || !results.length) {
                        showStatus('Location not found.', 3);
                        return;
                    }
                    const lat = parseFloat(results[0].lat);
                    const lon = parseFloat(results[0].lon);
                    map.setView([lat, lon], 13);
                    await fetchAround(lat, lon, 31); // fresh ~50 km viewport
                    filterByDistance(lat, lon, 31); // ~50 km
                } catch (err) {
                    console.error('Geocode error:', err);
                    showStatus('Search failed. Please try again.', 3);
                }
            }

            async function focusNearMe(lat, lon) {
                setUserLocation(lat, lon);
                // Google-style near-me: center at a fixed zoom; the viewport
                // itself is the fetch region — no hardcoded radius.
                map.setView([lat, lon], NEAR_ME_ZOOM);
                // Fetch the framed viewport for fresh timings; a failed fetch
                // falls back to whatever allMosques already holds.
                const b = map.getBounds();
                const fetched = await fetchMosquesInBounds(b);
                const viewMosques = fetched !== null ? fetched
                    : allMosques.filter(function(m) {
                        return b.contains([m.latitude, m.longitude]);
                    });
                renderMosques(viewMosques, false);
                if (!viewMosques.length) {
                    showStatus('No mosques near you yet — drag the map to explore.', 5);
                } else {
                    statusMsg.style.display = 'none';
                }
            }

            // Coarse city-level fallback when browser geolocation fails —
            // server-side IP lookup via our own endpoint (no third-party
            // client rate limits, no permission prompt).
            async function fetchApproxLocation() {
                try {
                    const res = await fetch('/api/approx-location/');
                    const data = await res.json();
                    if (data && data.success && data.latitude && data.longitude) {
                        return {lat: parseFloat(data.latitude), lon: parseFloat(data.longitude)};
                    }
                } catch (err) {
                    console.error('IP geolocation error:', err);
                }
                return null;
            }

            async function focusByIP() {
                const loc = await fetchApproxLocation();
                if (loc) {
                    focusNearMe(loc.lat, loc.lon);
                    return true;
                }
                return false;
            }

            async function onNearMe() {
                if (!navigator.geolocation) {
                    if (await focusByIP()) {
                        showStatus('Approximate location via network.', 3);
                    } else {
                        showStatus('Geolocation is not supported by your browser.', 3);
                    }
                    return;
                }
                showStatus('Finding your location...', 5);
                navigator.geolocation.getCurrentPosition(function(position) {
                    statusMsg.style.display = 'none';
                    focusNearMe(position.coords.latitude, position.coords.longitude);
                }, async function(err) {
                    if (await focusByIP()) {
                        showStatus('Approximate location via network.', 3);
                    } else {
                        showStatus(err && err.code === 1
                            ? 'Location permission is blocked — enable it in site settings.'
                            : 'Could not get your location.', 5);
                    }
                }, GEO_OPTS);
            }

            function parseClockMin(str) {
                const m = /(\d{1,2}):(\d{2})\s*(am|pm)/i.exec(str || '');
                if (!m) return null;
                let h = parseInt(m[1], 10) % 12;
                if (m[3].toLowerCase() === 'pm') h += 12;
                return h * 60 + parseInt(m[2], 10);
            }

            function mosqueNowFor(tz) {
                if (tz) {
                    try {
                        const parts = new Intl.DateTimeFormat('en-US', {
                            timeZone: tz, hour12: false,
                            hour: '2-digit', minute: '2-digit', weekday: 'short'
                        }).formatToParts(new Date());
                        let hh = 0, mm = 0, dow = -1;
                        parts.forEach(function (p) {
                            if (p.type === 'hour') hh = parseInt(p.value, 10) % 24;
                            if (p.type === 'minute') mm = parseInt(p.value, 10);
                            if (p.type === 'weekday') {
                                dow = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.value);
                            }
                        });
                        return {mins: hh * 60 + mm, dow: dow};
                    } catch (e) { /* unknown tz — fall back to device clock */ }
                }
                const n = new Date();
                return {mins: n.getHours() * 60 + n.getMinutes(), dow: n.getDay()};
            }

            // The server computes next_salah once per fetch; we recompute
            // locally every minute so pins and the modal highlight keep
            // advancing even on cached data, in each mosque's own timezone.
            const SALAH_ORDER = [['fajr', 'Fajr'], ['dhuhr', 'Dhuhr'], ['asr', 'Asr'],
                                 ['maghrib', 'Maghrib'], ['isha', 'Isha']];
            const JUMMAH_KEYS = [['jummah', "Jumu'ah"], ['jummah2', "Jumu'ah 2"],
                                 ['jummah3', "Jumu'ah 3"]];
            function computeNextSalah(m) {
                const t = m && m.timings;
                if (!t) return {name: null, time: ''};
                const mn = mosqueNowFor(m.timezone);
                let order = SALAH_ORDER;
                if (mn.dow === 5) {
                    // Friday — Jumu'ah slots replace Dhuhr when Jumu'ah times exist.
                    const jummahs = [];
                    for (let j = 0; j < JUMMAH_KEYS.length; j++) {
                        if (parseClockMin(t[JUMMAH_KEYS[j][0]]) !== null) {
                            jummahs.push(JUMMAH_KEYS[j]);
                        }
                    }
                    if (jummahs.length) {
                        order = [SALAH_ORDER[0]].concat(jummahs).concat(SALAH_ORDER.slice(2));
                    }
                }
                for (let i = 0; i < order.length; i++) {
                    const key = order[i][0];
                    const mins = parseClockMin(t[key]);
                    if (mins !== null && mins > mn.mins) {
                        return {name: order[i][1], time: t[key]};
                    }
                }
                return t.fajr ? {name: 'Fajr', time: t.fajr} : {name: null, time: ''};
            }

            // Merge fetched mosques into allMosques — update by id so a
            // viewport refetch refreshes timings on pins already shown.
            function mergeMosques(list) {
                const idx = {};
                allMosques.forEach(function(m, i) { idx[m.id] = i; });
                list.forEach(function(m) {
                    if (idx[m.id] !== undefined) allMosques[idx[m.id]] = m;
                    else allMosques.push(m);
                });
            }

            // Fetch mosques — with a 's,w,n,e' bbox only that viewport comes
            // back; without it the whole feed (boot fallback). Returns the
            // fetched list, or null on failure.
            async function fetchMosques(bboxParam) {
                try {
                    const res = await fetch('/api/public/mosques/' +
                        (bboxParam ? '?bbox=' + bboxParam : ''));
                    const data = await res.json();
                    if (!data.success || !data.mosques) return null;
                    mergeMosques(data.mosques);
                    try {
                        localStorage.setItem(MAP_CACHE_KEY,
                            JSON.stringify({saved: Date.now(), mosques: allMosques}));
                    } catch (e) { /* storage full or blocked */ }
                    return data.mosques;
                } catch (err) {
                    return null;
                }
            }

            // Bounding box in degrees covering `miles` around a point (s,w,n,e).
            function milesBox(lat, lon, miles) {
                const km = miles * 1.60934;
                const latD = km / 111.32;
                const lngD = km / (111.32 * Math.cos(lat * Math.PI / 180));
                return [lat - latD, lon - lngD, lat + latD, lon + lngD];
            }

            function fetchAround(lat, lon, miles) {
                return fetchMosques(milesBox(lat, lon, miles).join(','));
            }

            function fetchMosquesInBounds(b) {
                return fetchMosques([
                    b.getSouth().toFixed(5), b.getWest().toFixed(5),
                    b.getNorth().toFixed(5), b.getEast().toFixed(5)
                ].join(','));
            }

            function loadCachedMosques() {
                try {
                    const c = JSON.parse(localStorage.getItem(MAP_CACHE_KEY));
                    if (c && Array.isArray(c.mosques) && c.mosques.length) {
                        allMosques = c.mosques;
                        return true;
                    }
                } catch (e) { /* no usable cache */ }
                return false;
            }

            // Recompute next-salah everywhere: pin labels + open modal row.
            function refreshSalahLabels() {
                allMosques.forEach(function (m) { m.next_salah = computeNextSalah(m); });
                markers.eachLayer(function (l) {
                    if (l.mosqueRef) l.setIcon(createIcon(l.mosqueRef));
                });
                if (openMosque) {
                    modal.querySelectorAll('.timing-row').forEach(function (r) {
                        r.classList.remove('next');
                    });
                    if (openMosque.next_salah && openMosque.next_salah.name) {
                        const el = document.getElementById('t-' + openMosque.next_salah.name.toLowerCase().replace(/\s+/g, ''));
                        if (el) el.closest('.timing-row').classList.add('next');
                    }
                }
            }
            setInterval(refreshSalahLabels, 60000);

            // Daily resync at ~1:30 AM — pull fresh timings so website-side
            // changes reach clients; a failed fetch keeps the cached list.
            (function scheduleResync() {
                const now = new Date();
                const nxt = new Date(now);
                nxt.setHours(1, 30, 0, 0);
                if (nxt <= now) nxt.setDate(nxt.getDate() + 1);
                setTimeout(async function tick() {
                    // Refresh just the current viewport — not the world feed.
                    const ok = map ? await fetchMosquesInBounds(map.getBounds())
                                   : await fetchMosques();
                    if (ok) {
                        refreshSalahLabels();
                        renderMosques(allMosques, false);
                    }
                    setTimeout(tick, 24 * 3600 * 1000);
                }, nxt - now);
            })();

            const SPLASH_MIN_MS = {% if brand.key == 'takbir' %}5000{% else %}0{% endif %};
            let map;
            try {
                // Cold-start retry: on app launch the network may not be up yet —
                // keep retrying (splash stays up) until mosque data arrives;
                // cached mosques fill the gap when available.
                const bootedAt = Date.now();
                // Viewport-first boot: coarse IP location scopes the initial
                // fetch to the user's area instead of pulling the whole feed.
                const isNativeApp = !!window.Capacitor;
                const autoNearMe = isNativeApp ||
                    AUTO_NEAR_ME_HOSTS.indexOf(location.hostname) >= 0;
                const approxLoc = await fetchApproxLocation();
                // Tiered viewport fetches bound the download — 25 mi, then
                // 100 mi around the coarse location. Small boxes also keep
                // the capped result set centered near the user in dense
                // regions; the zoom-14 near-me fetch refines further.
                if (approxLoc) {
                    await fetchAround(approxLoc.lat, approxLoc.lon, 25);
                    if (!allMosques.length) await fetchAround(approxLoc.lat, approxLoc.lon, 100);
                }
                if (!allMosques.length) {
                    if (autoNearMe) {
                        // App hosts never pull the world feed — an empty area
                        // stays empty; near-me fetches below and the local
                        // cache fill any gap.
                        loadCachedMosques();
                    } else if (await fetchMosques() === null) {
                        // Web only: full feed as last resort, with retries.
                        loadCachedMosques();
                        for (let tries = 0; !allMosques.length && tries < 20; tries++) {
                            await new Promise(function (r) { setTimeout(r, 3000); });
                            await fetchMosques();
                        }
                    }
                }
                // Takbir splash shows at least SPLASH_MIN_MS after app launch.
                const holdMs = SPLASH_MIN_MS - (Date.now() - bootedAt);
                if (holdMs > 0) await new Promise(function (r) { setTimeout(r, holdMs); });
                loader.style.display = 'none';

                map = L.map('map').setView([20, 0], 2);
                markers.addTo(map);

                L.tileLayer('{{ tile_url }}', {
                    maxZoom: 20,
                    subdomains: '{{ tile_subdomains|default:"abcd" }}',
                    tileSize: 512,
                    zoomOffset: -1,
                    attribution: '{{ attribution|safe }}'
                }).addTo(map);

                searchInput.addEventListener('focus', function() {
                    dropdown.classList.add('open');
                });
                searchInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        hideDropdown();
                        geocodeAndFocus(e.target.value);
                    } else if (e.key === 'Escape') {
                        hideDropdown();
                        searchInput.blur();
                    }
                });

                let suggestTimer = null;
                searchInput.addEventListener('input', function() {
                    dropdown.classList.add('open');
                    clearTimeout(suggestTimer);
                    const q = searchInput.value.trim();
                    if (q.length < 3) { ddResults.innerHTML = ''; return; }
                    suggestTimer = setTimeout(function() { fetchSuggestions(q); }, 350);
                });

                document.getElementById('dd-current-loc').addEventListener('click', function() {
                    hideDropdown();
                    searchInput.value = '';
                    onNearMe();
                });

                document.addEventListener('click', function(e) {
                    if (!e.target.closest('.search-box')) hideDropdown();
                });

                // Only offer "Search this area" after the user physically
                // gestures on the map — initial fitBounds and programmatic
                // moves (Current Location, search picks) don't count.
                let userGestured = false;
                map._container.addEventListener('pointerdown', function() {
                    userGestured = true;
                });
                map.on('moveend', function() {
                    if (userGestured) {
                        areaBtn.style.display = 'block';
                        // Re-thin the loaded set for the new view — zooming
                        // in reveals pins the wide-view grid collapsed, and
                        // panning re-shows what was already fetched.
                        const vb = map.getBounds();
                        renderMosques(allMosques.filter(function(m) {
                            return vb.contains([m.latitude, m.longitude]);
                        }), false);
                    }
                    userGestured = false;
                });
                areaBtn.addEventListener('click', async function() {
                    areaBtn.style.display = 'none';
                    const b = map.getBounds();
                    // Fetch this viewport for fresh timings; fall back to the
                    // already-loaded list when the network fails.
                    const fetched = await fetchMosquesInBounds(b);
                    const inView = fetched !== null ? fetched
                        : allMosques.filter(function(m) {
                            return b.contains([m.latitude, m.longitude]);
                        });
                    if (inView.length === 0) {
                        showStatus('No mosques found in this area.', 4);
                    } else {
                        statusMsg.style.display = 'none';
                    }
                    renderMosques(inView);
                });

                // Don't return early on empty — app hosts still need the
                // geolocation flow below to drive the near-me fetch.
                if (allMosques.length) {
                    refreshSalahLabels();
                    renderMosques(allMosques);
                } else {
                    showStatus('No mosques found.', 4);
                }

                // Native apps always open on the user's location; the web
                // page only auto-zooms on whitelisted hosts so general
                // visitors don't get an unprompted permission request.
                // (isNativeApp/autoNearMe computed during boot, above.)
                if (!navigator.geolocation && autoNearMe) {
                    focusByIP();
                } else if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(function(position) {
                        if (autoNearMe) {
                            focusNearMe(position.coords.latitude, position.coords.longitude);
                        } else {
                            setUserLocation(position.coords.latitude, position.coords.longitude);
                        }
                    }, async function(err) {
                        if (autoNearMe) {
                            // Browser geo failed (permission, OS-level off, or
                            // timeout) — fall back to IP so the map still
                            // zooms to the user's area.
                            if (await focusByIP()) {
                                showStatus('Approximate location via network.', 3);
                            } else if (err && err.code === 1) {
                                showStatus('Enable location permission to see mosques near you.', 5);
                            }
                        }
                    }, GEO_OPTS);
                }
            } catch (err) {
                console.error('Map load error:', err);
                loader.textContent = 'Error loading map.';
                loader.style.display = 'flex';
            }
        })();
    </script>
</body>
</html>
