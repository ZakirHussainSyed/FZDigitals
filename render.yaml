services:
  - type: web
    name: fzdigitals
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    releaseCommand: python manage.py migrate --noinput && python create_superuser.py
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: fzdigitals.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: fzdigitals-db
          property: connectionString
      - key: AWS_STORAGE_BUCKET_NAME
        value: fzdigitals-media
      - key: AWS_S3_REGION_NAME
        value: us-east-2

databases:
  - name: fzdigitals-db
    databaseName: fzdigitals
    user: fzdigitals
