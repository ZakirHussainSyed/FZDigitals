services:
  - type: web
    name: fzdigitals
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi --log-file -
    releaseCommand: python manage.py migrate --noinput

crons:
  - name: keep-awake
    schedule: "*/10 * * * *"
    command: "curl https://fzdigitials.onrender.com/"
